<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6a73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Planlı Bakım Takvimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Yerleşim: solda gezinme, üstte durum şeridi, altta öncelik kuyruğu ve makine sıralaması.
   Renk: grafit nötrler + çelik-turkuaz vurgu. Durum renkleri (kırmızı/amber/mavi-gri) vurgudan ayrı tutulur.
   Yazı: IBM Plex Sans (metin), IBM Plex Mono (makine etiketleri ve sayılar). */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface-2:#f7f9fb; --line:#dde3e8; --line-2:#ebeff2;
  --ink:#15202a; --ink-2:#465665; --ink-3:#637382;
  --accent:#0b6a73; --accent-ink:#ffffff; --accent-soft:#e0f0f1; --accent-line:#a9d3d6;
  --bad:#c0392b; --bad-ink:#ffffff; --bad-soft:#fce9e6;
  --warn:#a85f00; --warn-ink:#ffffff; --warn-soft:#fdf1d9;
  --good:#2b7a4b; --good-soft:#e1f3e8;
  --plan:#486a8c; --plan-ink:#ffffff; --plan-soft:#e7eef5;
  --shadow:0 12px 40px rgba(14,24,34,.16);
  --font:'IBM Plex Sans',system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --lw:224px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151b; --surface:#151e26; --surface-2:#1a2530; --line:#26343f; --line-2:#1f2b35;
    --ink:#e7eef3; --ink-2:#aab8c4; --ink-3:#8394a3;
    --accent:#4cc2c9; --accent-ink:#052328; --accent-soft:#12353a; --accent-line:#1f5a60;
    --bad:#ff8272; --bad-ink:#2a0c08; --bad-soft:#3a1d1a;
    --warn:#f2b24d; --warn-ink:#2b1a00; --warn-soft:#38290f;
    --good:#6fd29a; --good-soft:#143122;
    --plan:#92b4d6; --plan-ink:#0c1a28; --plan-soft:#1b2a3a;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#151e26; --surface-2:#1a2530; --line:#26343f; --line-2:#1f2b35;
  --ink:#e7eef3; --ink-2:#aab8c4; --ink-3:#8394a3;
  --accent:#4cc2c9; --accent-ink:#052328; --accent-soft:#12353a; --accent-line:#1f5a60;
  --bad:#ff8272; --bad-ink:#2a0c08; --bad-soft:#3a1d1a;
  --warn:#f2b24d; --warn-ink:#2b1a00; --warn-soft:#38290f;
  --good:#6fd29a; --good-soft:#143122;
  --plan:#92b4d6; --plan-ink:#0c1a28; --plan-soft:#1b2a3a;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-theme="light"]{ color-scheme:light; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
small{font-size:12px}
b,strong{font-weight:600}
.mono,.tag{font-family:var(--mono)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- Kabuk ---- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px 16px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.brand small{color:var(--ink-3);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;font:600 11.5px var(--mono);text-align:center;background:var(--warn-soft);color:var(--warn)}
.nav .n.bad{background:var(--bad-soft);color:var(--bad)}
.side-foot{margin-top:auto;padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-3);font-size:12px;line-height:1.5}
.side-foot b{color:var(--ink-2)}
.main{min-width:0;padding:0 28px 64px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 14px;background:var(--bg)}
.top h1{font-size:22px;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.top p{color:var(--ink-3);font-size:13px;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:10px}
.tabbar{display:none}

/* ---- Düğmeler ve girdiler ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.done:hover{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.icon-btn{position:relative;display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn .b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--bad-ink);font:600 11px/18px var(--mono);text-align:center}
.icon-btn .b.warn{background:var(--warn);color:var(--warn-ink)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.fld em{font-style:normal;font-size:12px;color:var(--ink-3)}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;min-width:0;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{height:auto;min-height:72px;padding:9px 11px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ---- Kart, rozet, durum ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-h h2{font-size:15px;letter-spacing:-.01em}
.card-h small{color:var(--ink-3)}
.pad{padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--plan-soft);color:var(--plan)}
.pill.good{background:var(--good-soft);color:var(--good)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--plan)}
.dot.overdue{background:var(--bad)}
.dot.soon{background:var(--warn)}
.dot.none{background:var(--line)}
.cls{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:6px;font:600 12px var(--mono)}
.cls.A{background:var(--ink);color:var(--surface)}
.cls.B{box-shadow:inset 0 0 0 1.5px var(--ink-2);color:var(--ink-2)}
.cls.C{background:var(--line-2);color:var(--ink-3)}
.tag{font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink-2);font-weight:500;font-size:13px}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip i{font:600 11.5px var(--mono);font-style:normal;opacity:.7}
.seg-ctl{display:inline-flex;padding:3px;border-radius:9px;background:var(--line-2);gap:2px}
.seg-ctl button{height:30px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--ink-2);font-weight:600;font-size:12.5px}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .grow{flex:1}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search .ic{position:absolute;left:11px;top:10px;color:var(--ink-3);width:17px;height:17px}
.search input{padding-left:36px}
.toolbar select{width:auto;min-width:150px}
.empty{padding:36px 18px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink)}
.banner p{flex:1 1 260px;font-size:13px}

/* ---- Genel bakış ---- */
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.strip{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0;margin-bottom:16px}
.strip>div{padding:20px 22px}
.strip>div+div{border-left:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:center}
.strip h2{font-size:18px;letter-spacing:-.015em;line-height:1.35;font-weight:500;text-wrap:balance}
.strip h2 b{font-family:var(--mono);font-weight:600}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line-2);margin:16px 0 10px;gap:2px}
.bar i{display:block;min-width:4px}
.bar .o{background:var(--bad)}
.bar .s{background:var(--warn)}
.bar .k{background:var(--plan)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.stat small{display:block;color:var(--ink-3);font-size:12px;line-height:1.3}
.stat b{display:block;margin-top:3px;font:600 24px/1.1 var(--mono);letter-spacing:-.02em}
.stat em{display:block;margin-top:3px;font-style:normal;font-size:12px;color:var(--ink-3)}
.stat.good b{color:var(--good)}
.stat.warn b{color:var(--warn)}
.stat.bad b{color:var(--bad)}
.qlist{padding:6px 8px 8px}
.qrow{display:grid;grid-template-columns:12px minmax(0,1.1fr) minmax(0,1.2fr) 112px auto;align-items:center;gap:14px;padding:11px 10px;border-radius:9px;cursor:pointer}
.qrow:hover{background:var(--surface-2)}
.qrow+.qrow{border-top:1px solid var(--line-2)}
.q-m{display:flex;align-items:center;gap:8px;min-width:0}
.q-mi{min-width:0;flex:1}
.q-mi b,.q-mi small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-mi small{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink-2)}
.q-t{min-width:0}
.q-t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-t small,.q-d small{color:var(--ink-3)}
.q-d b{display:block;font-size:13px}
.q-d.overdue b{color:var(--bad)}
.q-d.soon b{color:var(--warn)}
.rank-list{padding:8px 8px 10px}
.rk-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto 12px;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;cursor:pointer}
.rk-row:hover{background:var(--surface-2)}
.rk-n{font:600 13px var(--mono);color:var(--ink-3)}
.rk-row:nth-child(-n+3) .rk-n{color:var(--ink)}
.rk-t{min-width:0}
.rk-t b,.rk-t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-t small{color:var(--ink-3)}
.tipcard{padding:18px;display:flex;flex-direction:column;gap:8px}
.tipcard .lab{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tipcard h3{font-size:15px;line-height:1.35;text-wrap:balance}
.tipcard p{color:var(--ink-2);font-size:13.5px;line-height:1.6}
.tipcard .more{align-self:flex-start;margin-top:4px}

/* ---- Zaman çizelgesi ---- */
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 12px;color:var(--ink-2);font-size:12.5px}
.tl-legend span{display:inline-flex;align-items:center;gap:7px}
.tl-legend i{display:inline-block;width:16px;height:10px;border-radius:5px}
.tl-legend .l-o{background:var(--bad)}
.tl-legend .l-s{background:var(--warn)}
.tl-legend .l-k{background:var(--plan)}
.tl-legend .l-p{border:1.5px dashed var(--plan)}
.tl-legend .l-w{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--warn) 60%,transparent)}
.tl-card{overflow:hidden}
.tl{overflow-x:auto;overscroll-behavior-x:contain}
.tl-in{position:relative;width:calc(var(--lw) + var(--W))}
.tl-head{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tl-corner{position:sticky;left:0;z-index:5;flex:none;width:var(--lw);padding:0 14px 7px;display:flex;align-items:flex-end;background:var(--surface-2);border-right:1px solid var(--line);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tl-scale{position:relative;flex:none;width:var(--W);height:54px}
.tl-month{position:absolute;top:0;height:27px;border-left:1px solid var(--line);padding:5px 8px;font-size:12px;font-weight:600;color:var(--ink-2);overflow:hidden;white-space:nowrap}
.tl-wk{position:absolute;top:32px;transform:translateX(-50%);font:500 11px var(--mono);color:var(--ink-3)}
.tl-today-tag{position:absolute;bottom:4px;transform:translateX(-50%);padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;z-index:2}
.tl-body{position:relative}
.tl-grid{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.tl-grid i{position:absolute;top:0;bottom:0}
.g-w{border-left:1px solid var(--line-2)}
.g-m{border-left:1px solid var(--line)}
.g-we{background:var(--surface-2);opacity:.7}
.g-today{border-left:2px solid var(--accent);opacity:.85}
.tl-row{position:relative;z-index:1;display:flex;border-bottom:1px solid var(--line-2)}
.tl-row:last-child{border-bottom:0}
.tl-name{position:sticky;left:0;z-index:4;flex:none;width:var(--lw);display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;background:var(--surface);border-right:1px solid var(--line);cursor:pointer}
.tl-name:hover{background:var(--surface-2)}
.tl-name .rk{font:600 12px var(--mono);color:var(--ink-3);width:22px;flex:none}
.tl-name div{min-width:0;flex:1}
.tl-name b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.tl-name small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-name small{color:var(--ink-3);font-family:var(--mono);font-size:11px}
.tl-lane{position:relative;flex:none;width:var(--W)}
.tl-mark{--c:var(--plan);--ci:var(--plan-ink);position:absolute;z-index:3;display:flex;align-items:center;gap:6px;height:22px;max-width:150px;padding:0 9px 0 6px;border:1.5px solid var(--c);border-radius:11px;background:var(--c);color:var(--ci);font-size:11.5px;font-weight:600;white-space:nowrap}
.tl-mark.overdue{--c:var(--bad);--ci:var(--bad-ink)}
.tl-mark.soon{--c:var(--warn);--ci:var(--warn-ink)}
.tl-mark i{width:8px;height:8px;border-radius:50%;background:var(--ci);flex:none}
.tl-mark span{overflow:hidden;text-overflow:ellipsis}
.tl-mark.proj{background:var(--surface);color:var(--c);border-style:dashed}
.tl-mark.proj i{background:var(--c)}
.tl-mark.dot-only{width:16px;height:16px;padding:0;justify-content:center;border-radius:50%;margin-top:3px}
.tl-mark.dot-only i{width:6px;height:6px}
.tl-mark:hover{z-index:6;filter:brightness(1.1);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tl-lead{position:absolute;z-index:2;height:10px;border-radius:5px;background:repeating-linear-gradient(135deg,var(--warn-soft) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--warn) 60%,transparent)}
.tl-lead.over{background:var(--bad-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--bad) 55%,transparent)}
.tl-none{position:absolute;left:12px;top:12px;color:var(--ink-3);font-size:12px}

/* ---- Makineler ---- */
.mlist{overflow:hidden}
.mrow{display:grid;grid-template-columns:44px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:16px;align-items:center;padding:14px 18px}
.mrow+.mrow{border-top:1px solid var(--line-2)}
.mrow .big{font:600 22px var(--mono);color:var(--ink-3);letter-spacing:-.03em}
.mrow:nth-child(-n+3) .big{color:var(--ink)}
.m-name b{display:block}
.m-name small{color:var(--ink-3);font-family:var(--mono);font-size:11.5px}
.m-score{display:flex;align-items:center;gap:10px}
.facs{display:inline-flex;align-items:flex-end;gap:3px;height:22px}
.facs i{display:block;width:5px;border-radius:2px;background:var(--ink-3);opacity:.85}
.m-score small{font:500 12px var(--mono);color:var(--ink-2)}
.m-next small{display:block;color:var(--ink-3);margin-top:3px}
.m-act{display:flex;gap:6px}
.howto{margin-bottom:14px;padding:14px 16px;font-size:13px;color:var(--ink-2)}
.howto b{color:var(--ink)}

/* ---- Planlar ---- */
.plist{overflow:hidden}
.prow{display:grid;grid-template-columns:116px minmax(0,1.1fr) minmax(0,1.4fr) 128px 150px auto;gap:14px;align-items:center;padding:12px 18px;cursor:pointer}
.prow:hover{background:var(--surface-2)}
.prow+.prow{border-top:1px solid var(--line-2)}
.prow .p-m{min-width:0}
.prow .p-t{min-width:0}
.prow .p-m b,.prow .p-m small,.prow .p-t b,.prow .p-t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .p-m small,.prow .p-t small,.prow .p-f,.prow .p-d small{color:var(--ink-3)}
.prow .p-f{font-size:13px;color:var(--ink-2)}
.prow .p-d b{display:block;font-size:13px}
.prow .p-d.overdue b{color:var(--bad)}
.prow .p-d.soon b{color:var(--warn)}
.p-act{display:flex;gap:6px}

/* ---- Geçmiş ---- */
.hrow{display:grid;grid-template-columns:96px minmax(0,1.2fr) minmax(0,1.4fr) 130px minmax(0,1fr);gap:14px;align-items:center;padding:12px 18px}
.hrow+.hrow{border-top:1px solid var(--line-2)}
.hrow b,.hrow small{display:block}
.hrow small{color:var(--ink-3)}
.hsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.hsum .card{padding:16px 18px}

/* ---- Rehber ---- */
.guide{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:880px}
.guide section{padding:22px 24px}
.guide h2{font-size:17px;letter-spacing:-.015em;margin-bottom:6px}
.guide .lead{color:var(--ink-2);margin-bottom:14px;max-width:68ch}
.guide p{max-width:68ch;color:var(--ink-2)}
.steps{display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 13px var(--mono)}
.steps b{display:block}
.steps span{color:var(--ink-2)}
.tbl{overflow-x:auto;margin-top:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;padding:8px 10px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:nth-child(-n+4){white-space:nowrap}
.rules{display:grid;gap:14px}
.rules li{max-width:68ch}
.rules b{display:block;color:var(--ink);margin-bottom:2px}
.rules span{color:var(--ink-2)}
.factors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.factors div{padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.factors b{display:block;font-size:13px}
.factors span{font-size:12.5px;color:var(--ink-2)}

/* ---- Ayarlar ---- */
.set{display:grid;gap:16px;max-width:820px}
.set section{padding:20px 22px}
.set h2{font-size:15px;margin-bottom:4px}
.set .sub{color:var(--ink-2);font-size:13px;margin-bottom:14px;max-width:62ch}
.set .btns{display:flex;flex-wrap:wrap;gap:8px}
.set .row3{max-width:480px}
.note{margin-top:10px;font-size:12.5px;color:var(--ink-3);max-width:62ch}
.ok-txt{color:var(--good);font-weight:600}

/* ---- Pencere, açılır panel, toast ---- */
dialog{padding:0;border:0;border-radius:14px;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,15,22,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 4px}
.dlg-h h2{font-size:17px;letter-spacing:-.015em;line-height:1.3}
.dlg-h p{color:var(--ink-3);font-size:13px;margin-top:2px}
.dlg-b{padding:14px 20px 8px;overflow-y:auto;display:grid;gap:14px}
.dlg-f{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 20px 18px}
.dlg-f .sp{margin-right:auto}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mini{display:grid;gap:6px;font-size:13px}
.mini li{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:8px;background:var(--surface-2)}
.mini li small{color:var(--ink-3)}
.dlg h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.scoreprev{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent-line)}
.scoreprev b{font:600 20px var(--mono)}
.scoreprev span{font-size:13px;color:var(--ink-2)}
.pop{position:fixed;z-index:60;top:68px;right:max(16px,calc((100vw - 1400px)/2 + 16px));width:min(400px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.pop-h b{font-size:14px}
.pop .it{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;cursor:pointer}
.pop .it:hover{background:var(--surface-2)}
.pop .it+.it{border-top:1px solid var(--line-2)}
.pop .it b,.pop .it small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .it small{color:var(--ink-3)}
.pop-f{padding:10px 16px 14px}
.toast{position:fixed;left:50%;bottom:24px;z-index:80;transform:translate(-50%,20px);max-width:calc(100vw - 32px);padding:11px 18px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
textarea.code{height:220px;font:12px/1.5 var(--mono)}

/* ---- Dar ekran ---- */
@media (max-width:1180px){
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .qrow{grid-template-columns:12px minmax(0,1fr) 104px auto;gap:6px 12px}

  .strip{grid-template-columns:minmax(0,1fr)}

  .tl-name small{display:none}

  .mrow{grid-template-columns:34px minmax(0,1fr) auto;gap:8px 12px;padding:14px}
  .mrow .m-score{grid-column:2;grid-row:2}
  .mrow .m-next{grid-column:2/4;grid-row:3}
  .mrow .m-act{grid-column:3;grid-row:1}
  .mrow .big{font-size:18px;align-self:start}
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px}
  .prow .p-s{grid-column:1;grid-row:1}
  .prow .p-t{grid-column:1/3;grid-row:2}
  .prow .p-m{grid-column:1/3;grid-row:3}
  .prow .p-d{grid-column:2;grid-row:1;text-align:right}
  .prow .p-act{grid-column:1/3;grid-row:4;margin-top:4px}
  .hrow{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}

  .hrow>*:nth-child(4){grid-column:2;grid-row:1}
  .hrow>*:nth-child(2){grid-column:1/3}
  .hrow>*:nth-child(3){grid-column:1/3}
  .hrow>*:nth-child(5){grid-column:1/3}
  .hsum{grid-template-columns:minmax(0,1fr)}
  .factors{grid-template-columns:minmax(0,1fr)}
  .guide section{padding:18px}
  .row3{grid-template-columns:minmax(0,1fr)}

}
@media (max-width:480px){

const KEY='planli-bakim.v1';
let S=null,memOnly=false;
const UI={q:'',st:'all',m:'all',sort:'prio',tip:null};
let route='genel';

const defaults=()=>({lead:{A:14,B:7,C:3},theme:'auto',notify:false,lastNotify:{},tlZoom:'ay3',tlClass:'all',showProj:true});
function normalize(o){
  o=o||{};
  const s=Object.assign(defaults(),o.settings||{});
  s.lead=Object.assign({A:14,B:7,C:3},s.lead||{});
  s.lastNotify=s.lastNotify||{};
  return {v:1,demo:!!o.demo,machines:Array.isArray(o.machines)?o.machines:[],tasks:Array.isArray(o.tasks)?o.tasks:[],history:Array.isArray(o.history)?o.history:[],settings:s};
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));memOnly=false;}catch(e){memOnly=true;}
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){memOnly=true;}
  if(raw){try{S=normalize(JSON.parse(raw));}catch(e){S=null;}}
  if(!S){S=normalize(demo());save();}
}

/* =========================================================
   Hesaplamalar
   ========================================================= */
const mById=id=>S.machines.find(m=>m.id===id);
const score=m=>(+m.safety||1)+(+m.production||1)+(+m.repair||1)+(+m.backup||1);
const klass=m=>{const s=score(m);return s>=15?'A':s>=10?'B':'C';};
const ranked=()=>S.machines.slice().sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name,'tr'));
const rankOf=id=>ranked().findIndex(m=>m.id===id)+1;
const everyOf=t=>Math.max(1,Math.floor(Number(t.every))||1);
function leadOf(t){
  if(t.lead!==null&&t.lead!==undefined&&t.lead!==''&&!isNaN(+t.lead))return Math.max(0,+t.lead);
  const m=mById(t.machineId);
  return S.settings.lead[m?klass(m):'C'];
}
function info(t){
  const due=parseD(t.due);
  const left=diff(due,today());
  const lead=leadOf(t);
  const st=left<0?'overdue':left<=lead?'soon':'ok';
  return {due,left,lead,st};
}
function enriched(){
  const out=[];
  S.tasks.forEach(t=>{const m=mById(t.machineId);if(m)out.push({t,m,i:info(t)});});
  return out;
}
const prio=(a,b)=>STORD[a.i.st]-STORD[b.i.st]||score(b.m)-score(a.m)||a.i.left-b.i.left;
function nextDue(t,doneD){
  const every=everyOf(t);
  if(t.mode==='after')return shift(doneD,every,t.unit);
  const due=parseD(t.due);
  let n=1,nd=shift(due,every*n,t.unit,anchorOf(t));
  while(nd<=doneD&&n<1000){n++;nd=shift(due,every*n,t.unit,anchorOf(t));}
  return nd;
}
function complete(taskId,doneISO,by,note){
  const t=S.tasks.find(x=>x.id===taskId);
  if(!t)return null;
  const m=mById(t.machineId);
  S.history.unshift({id:uid(),taskId:t.id,machineId:t.machineId,tag:m?m.tag:'',mname:m?m.name:'',title:t.title,due:t.due,done:doneISO,by:by||'',note:note||''});
  const nd=nextDue(t,parseD(doneISO));
  t.due=iso(nd);
  if(by)t.owner=by;
  save();
  return nd;
}
function compliance(){
  const from=addDays(today(),-90);
  const hs=S.history.filter(h=>parseD(h.done)>=from);
  const ontime=hs.filter(h=>h.done<=h.due).length;
  const ov=enriched().filter(x=>x.i.st==='overdue'&&x.i.left>=-90).length;
  const n=hs.length+ov;
  return n?{pct:Math.round(ontime/n*100),ontime,n}:null;
}
function worst(mid,E){
  const l=E.filter(x=>x.t.machineId===mid);
  if(!l.length)return 'none';
  return l.some(x=>x.i.st==='overdue')?'overdue':l.some(x=>x.i.st==='soon')?'soon':'ok';
}
function alertItems(){return enriched().filter(x=>x.i.st!=='ok').sort(prio);}

const ZOOM={hf:{label:'6 hafta',dayW:28,ahead:42},ay3:{label:'3 ay',dayW:15,ahead:90},ay6:{label:'6 ay',dayW:8,ahead:180}};
function vZaman(){
  const z=ZOOM[S.settings.tlZoom]||ZOOM.ay3;
  const back=14,total=back+z.ahead,dw=z.dayW,W=total*dw;
  const start=addDays(today(),-back);
  const todayX=back*dw+dw/2;
  const showLbl=dw>=15;
  let mon='',wk='',grid='';
  for(let d=new Date(start);diff(d,start)<total;){
    const nx=new Date(d.getFullYear(),d.getMonth()+1,1);
    const a=diff(d,start),b=Math.min(total,diff(nx,start));
    mon+='<div class="tl-month" style="left:'+a*dw+'px;width:'+(b-a)*dw+'px">'+MONTHS[d.getMonth()]+' '+d.getFullYear()+'</div>';
    if(a>0)grid+='<i class="g-m" style="left:'+a*dw+'px"></i>';
    d=nx;
  }
  for(let i=0;i<total;i++){
    const d=addDays(start,i),dow=d.getDay();
    if(dow===1){grid+='<i class="g-w" style="left:'+i*dw+'px"></i>';if(showLbl)wk+='<span class="tl-wk" style="left:'+(i*dw+dw/2)+'px">'+d.getDate()+'</span>';}
    if(showLbl&&(dow===0||dow===6))grid+='<i class="g-we" style="left:'+i*dw+'px;width:'+dw+'px"></i>';
  }
  const cf=S.settings.tlClass;
  const list=ranked().filter(m=>cf==='all'||klass(m)===cf);
  const rows=list.map(m=>{
    const rk=rankOf(m.id);
    const ev=[];
    S.tasks.filter(t=>t.machineId===m.id).forEach(t=>{
      const i=info(t),every=everyOf(t);
      const approx=t.unit==='gun'?every:t.unit==='hafta'?7*every:t.unit==='ay'?30*every:365*every;
      ev.push({t:t,i:i,idx:diff(i.due,start),proj:false,date:i.due});
      if(S.settings.showProj&&approx>=7){
        for(let k=1;k<400;k++){
          const dt=shift(i.due,every*k,t.unit,anchorOf(t)),idx=diff(dt,start);
          if(idx>=total)break;
          if(idx<0)continue;
          ev.push({t:t,i:Object.assign({},i,{st:'ok'}),idx:idx,proj:true,date:dt,freq:approx});
        }
      }
    });
    const vis=ev.filter(e=>e.idx<total).sort((a,b)=>Math.max(a.idx,0)-Math.max(b.idx,0));
    const lanes=[];let marks='',bars='';
    vis.forEach(e=>{
      const cx=Math.max(0,e.idx)*dw+dw/2;
      const left=Math.max(0,cx-8);
      const lbl=showLbl&&!(e.proj&&e.freq<=14);
      const wpx=lbl?Math.min(150,34+e.t.title.length*6.3):16;
      let L=lanes.findIndex(end=>end<=left-4);
      if(L<0){L=lanes.length;lanes.push(0);}
      lanes[L]=left+wpx;
      const y=8+L*28;
      if(!e.proj){
        if(e.i.st==='overdue'){
          if(todayX-cx>2)bars+='<i class="tl-lead over" style="left:'+cx+'px;width:'+(todayX-cx)+'px;top:'+(y+6)+'px"></i>';
        }else{
          const a=Math.max(0,(e.idx-e.i.lead)*dw+dw/2);
          if(cx-a>2)bars+='<i class="tl-lead" style="left:'+a+'px;width:'+(cx-a)+'px;top:'+(y+6)+'px"></i>';
        }
      }
      const tip=m.tag+' · '+e.t.title+' · '+fmtDate(e.date)+(e.proj?' (öngörülen)':e.i.st==='overdue'?' · '+dueText(e.i.left):'');
      marks+='<button type="button" class="tl-mark '+e.i.st+(e.proj?' proj':'')+(lbl?'':' dot-only')+'" data-act="open-task" data-id="'+e.t.id+'" style="left:'+left+'px;top:'+y+'px" title="'+esc(tip)+'" aria-label="'+esc(tip)+'"><i></i>'+(lbl?'<span>'+esc(e.t.title)+'</span>':'')+'</button>';
    });
    const h=Math.max(1,lanes.length)*28+14;
    return '<div class="tl-row"><div class="tl-name" data-act="edit-machine" data-id="'+m.id+'" title="Makineyi düzenle"><span class="rk">#'+rk+'</span><div><b>'+esc(m.name)+'</b><small>'+esc(m.tag)+'</small></div>'+clsB(klass(m))+'</div>'
      +'<div class="tl-lane" style="height:'+h+'px">'+bars+marks+(vis.length?'':'<span class="tl-none">Plan yok</span>')+'</div></div>';
  }).join('');
  const controls='<div class="toolbar">'
    +seg('tl-zoom',Object.keys(ZOOM).map(k=>[k,ZOOM[k].label]),S.settings.tlZoom)
    +seg('tl-class',[['all','Tümü'],['A','A'],['B','B'],['C','C']],S.settings.tlClass)

/* =========================================================
   Görünüm: Bakım planları
   ========================================================= */
function planFiltered(){
  let E=enriched();
  const q=trLower(UI.q.trim());
  if(q)E=E.filter(x=>trLower(x.t.title+' '+x.m.name+' '+x.m.tag+' '+(x.t.owner||'')+' '+(x.t.cat||'')).includes(q));
  if(UI.st!=='all')E=E.filter(x=>x.i.st===UI.st);
  if(UI.m!=='all')E=E.filter(x=>x.t.machineId===UI.m);
  if(UI.sort==='date')E.sort((a,b)=>a.i.left-b.i.left);
  else if(UI.sort==='machine')E.sort((a,b)=>a.m.name.localeCompare(b.m.name,'tr')||a.i.left-b.i.left);
  else E.sort(prio);
  return E;
}
function pRow(x){
  const t=x.t,m=x.m,i=x.i;
  return '<div class="prow" data-act="open-task" data-id="'+t.id+'" tabindex="0">'
    +'<div class="p-s">'+pill(i.st)+'</div>'
    +'<div class="p-m"><b>'+esc(m.name)+'</b><small>'+esc(m.tag)+' · Sınıf '+klass(m)+'</small></div>'
    +'<div class="p-t"><b>'+esc(t.title)+'</b><small>'+esc(t.cat||'')+(t.owner?' · '+esc(t.owner):'')+(t.hours?' · '+t.hours+' sa':'')+'</small></div>'
    +'<div class="p-f">'+freq(t)+'<br><small>'+(t.mode==='after'?'Yapıldığı tarihten':'Sabit takvim')+'</small></div>'
    +'<div class="p-d '+i.st+'"><b>'+dueText(i.left)+'</b><small>'+fmtDate(i.due)+'</small></div>'
    +'<div class="p-act"><button class="btn sm done" data-act="done" data-id="'+t.id+'">'+ic('check')+'Yapıldı</button><button class="btn sm ghost" data-act="edit-task" data-id="'+t.id+'" aria-label="Planı düzenle">'+ic('edit')+'</button></div></div>';
}
function renderPlanList(){

/* =========================================================
   Görünüm: Geçmiş
   ========================================================= */
function vGecmis(){
  const H=S.history.slice().sort((a,b)=>a.done<b.done?1:a.done>b.done?-1:0);
  const d90=H.filter(h=>diff(today(),parseD(h.done))<=90);
  const late=d90.filter(h=>h.done>h.due);
  const avg=late.length?Math.round(late.reduce((a,h)=>a+diff(parseD(h.done),parseD(h.due)),0)/late.length):0;
  const pct=d90.length?Math.round((d90.length-late.length)/d90.length*100):null;
  const rows=H.slice(0,300).map(h=>{
    const l=diff(parseD(h.done),parseD(h.due));
    return '<div class="hrow"><div><b>'+fmtShort(parseD(h.done))+'</b><small>'+parseD(h.done).getFullYear()+'</small></div>'
      +'<div><b>'+esc(h.mname||'-')+'</b><small class="mono">'+esc(h.tag||'')+'</small></div>'
      +'<div><b>'+esc(h.title)+'</b><small>Planlanan: '+fmtDate(parseD(h.due))+'</small></div>'
      +'<div>'+(l<=0?'<span class="pill good">Zamanında</span>':'<span class="pill soon">'+l+' gün geç</span>')+'</div>'
      +'<div><b>'+esc(h.by||'-')+'</b><small>'+esc(h.note||'')+'</small></div></div>';
  }).join('');
  return '<div class="hsum"><div class="card stat"><small>Son 90 günde tamamlanan</small><b>'+d90.length+'</b></div>'
    +'<div class="card stat '+(pct==null?'':pct>=90?'good':pct>=75?'warn':'bad')+'"><small>Zamanında tamamlama</small><b>'+(pct==null?'-':'%'+pct)+'</b></div>'
    +'<div class="card stat"><small>Geç kalanlarda ortalama gecikme</small><b>'+avg+' gün</b></div></div>'
    +'<div class="card">'+(rows||empty('Henüz tamamlanmış bakım yok','Bir planda "Yapıldı" düğmesine bastığında kayıt buraya düşer.'))+'</div>';
}

  zaman:{title:'Zaman Çizelgesi',sub:()=>'Makineler önem sırasına göre dizili, en kritik olan en üstte',r:vZaman,after:()=>{
    const el=$('#tl');
    if(el&&window.innerWidth<860)el.scrollLeft=11*(ZOOM[S.settings.tlZoom]||ZOOM.ay3).dayW;
  }},
  makineler:{title:'Makineler',sub:()=>S.machines.length+' makine · önem puanına göre sıralı',r:vMakineler},
  planlar:{title:'Bakım Planları',sub:()=>S.tasks.length+' plan',r:vPlanlar,after:renderPlanList},
  gecmis:{title:'Geçmiş',sub:()=>'Tamamlanan bakımlar',r:vGecmis},
  rehber:{title:'Rehber',sub:()=>'Planlı bakım takibinde saha tecrübesi',r:vRehber},
  ayarlar:{title:'Ayarlar',sub:()=>'Uyarılar, takvim ve veri',r:vAyarlar}
};
const NAV=[['genel','Genel Bakış','Genel','grid'],['zaman','Zaman Çizelgesi','Zaman','gantt'],['makineler','Makineler','Makine','cog'],['planlar','Bakım Planları','Planlar','list'],['gecmis','Geçmiş','Geçmiş','clock'],['rehber','Rehber','Rehber','book'],['ayarlar','Ayarlar','Ayarlar','sliders']];
function render(){
  const v=VIEWS[route]||VIEWS.genel;
  $('#pageTitle').textContent=v.title;
  $('#pageSub').textContent=v.sub();
  $('#view').innerHTML=v.r();
  if(v.after)v.after();
  chrome();
}
function chrome(){
  const A=alertItems();
  const over=A.filter(x=>x.i.st==='overdue').length;
  const badge=A.length?'<span class="n'+(over?' bad':'')+'">'+A.length+'</span>':'';
  $('#nav').innerHTML=NAV.map(n=>'<button type="button" data-act="go" data-r="'+n[0]+'"'+(route===n[0]?' aria-current="page"':'')+'>'+ic(n[3])+n[1]+(n[0]==='planlar'?badge:'')+'</button>').join('');
  $('#tabbar').innerHTML=NAV.map(n=>'<button type="button" data-act="go" data-r="'+n[0]+'"'+(route===n[0]?' aria-current="page"':'')+'>'+ic(n[3])+'<span>'+n[2]+'</span>'+(n[0]==='planlar'&&A.length?'<span class="n">'+A.length+'</span>':'')+'</button>').join('');
  const b=$('#bellBadge');
  b.hidden=!A.length;b.textContent=A.length;b.className='b'+(over?'':' warn');
  document.title=(A.length?'('+A.length+') ':'')+'Planlı Bakım Takvimi';
  $('#sideFoot').innerHTML=memOnly
    ?'<b>Kayıt yapılamıyor.</b> Tarayıcı depolamayı engelliyor. Yedeklemeden sayfayı kapatma.'
    :'<b>Veriler bu cihazda.</b> Hesap ve sunucu yok. Düzenli yedek almayı unutma.<br><button class="btn sm" style="margin-top:8px" data-act="export-json">Yedekle</button>';
}
function nav(r){
  if(!VIEWS[r])return;
  route=r;
  $('#pop').hidden=true;
  try{history.replaceState(null,'','#'+r);}catch(e){}
  render();
  window.scrollTo(0,0);
}
const origTheme=document.documentElement.getAttribute('data-theme');
function applyTheme(){
  const t=S.settings.theme,r=document.documentElement;
  if(t==='light'||t==='dark')r.setAttribute('data-theme',t);
  else if(origTheme)r.setAttribute('data-theme',origTheme);
  else r.removeAttribute('data-theme');
}

const dlg=$('#dlg');

  dlg.innerHTML=html;

  if(f&&onSubmit)f.addEventListener('submit',e=>{e.preventDefault();if(onSubmit(new FormData(f),f)!==false)closeDlg();});
  if(setup)setup(f);
  const first=$('input:not([type=hidden]),select,textarea',dlg);
  if(first&&matchMedia('(pointer:fine)').matches)first.focus();
}
function closeDlg(){
  if(dlg.open){try{dlg.close();}catch(e){dlg.removeAttribute('open');}}
  dlg.innerHTML='';
}
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg();});

let toastT=0;
function toast(msg){
  const t=$('#toast');

const exportObj=()=>({app:'planli-bakim',version:1,exported:iso(today()),machines:S.machines,tasks:S.tasks,history:S.history,settings:{lead:S.settings.lead}});
function sanitize(o){
  if(!o||!Array.isArray(o.machines)||!Array.isArray(o.tasks))throw new Error('format');
  const re=/^\d{4}-\d{2}-\d{2}$/;
  const machines=o.machines.filter(m=>m&&m.id&&m.tag&&m.name).map(m=>({id:String(m.id),tag:String(m.tag),name:String(m.name),area:String(m.area||''),safety:Math.min(5,Math.max(1,+m.safety||3)),production:Math.min(5,Math.max(1,+m.production||3)),repair:Math.min(5,Math.max(1,+m.repair||3)),backup:Math.min(5,Math.max(1,+m.backup||3)),notes:String(m.notes||'')}));
  const ids=new Set(machines.map(m=>m.id));
  const tasks=o.tasks.filter(t=>t&&t.id&&t.title&&ids.has(t.machineId)&&re.test(String(t.due))).map(t=>({id:String(t.id),machineId:t.machineId,title:String(t.title),cat:String(t.cat||''),every:Math.max(1,parseInt(t.every,10)||1),unit:UNIT[t.unit]?t.unit:'ay',mode:t.mode==='after'?'after':'fixed',due:String(t.due),day:Math.min(31,Math.max(0,parseInt(t.day,10)||0)),lead:(t.lead===null||t.lead===undefined||t.lead==='')?null:Math.max(0,+t.lead||0),owner:String(t.owner||''),hours:+t.hours||0,notes:String(t.notes||'')}));
  const history=(Array.isArray(o.history)?o.history:[]).filter(h=>h&&re.test(String(h.done))&&re.test(String(h.due))&&h.title).map(h=>({id:String(h.id||uid()),taskId:String(h.taskId||''),machineId:String(h.machineId||''),tag:String(h.tag||''),mname:String(h.mname||''),title:String(h.title),due:String(h.due),done:String(h.done),by:String(h.by||''),note:String(h.note||'')}));
  return {machines,tasks,history,lead:o.settings&&o.settings.lead};
}

const b64u=bytes=>{let s='';bytes.forEach(b=>{s+=String.fromCharCode(b);});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;};
async function encodeShare(obj){
  let bytes=new TextEncoder().encode(JSON.stringify(obj)),tag='r';
  if('CompressionStream' in window){
    const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
    bytes=new Uint8Array(await new Response(cs).arrayBuffer());tag='g';
  }
  return tag+b64u(bytes);
}
async function decodeShare(str){
  let bytes=unb64u(str.slice(1));
  if(str[0]==='g'){
    const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    bytes=new Uint8Array(await new Response(ds).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

function buildICS(){
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Planli Bakim Takvimi//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Planlı Bakım'];
  const horizon=addDays(today(),365);
  enriched().forEach(x=>{
    const t=x.t,m=x.m,every=everyOf(t);
    const approx=t.unit==='gun'?every:t.unit==='hafta'?7*every:t.unit==='ay'?30*every:365*every;
    const dates=[x.i.due];
    if(approx>=7){for(let k=1;k<400;k++){const dt=shift(x.i.due,every*k,t.unit,anchorOf(t));if(dt>horizon)break;dates.push(dt);}}
    dates.forEach(dt=>{
      const ds=iso(dt).replace(/-/g,''),de=iso(addDays(dt,1)).replace(/-/g,'');
      L.push('BEGIN:VEVENT','UID:'+t.id+'-'+ds+'@planli-bakim','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+de,
        'SUMMARY:'+icsEsc('['+klass(m)+'] '+m.tag+' · '+t.title),
        'DESCRIPTION:'+icsEsc(m.name+'\n'+(t.cat||'')+(t.owner?'\nSorumlu: '+t.owner:'')+(t.hours?'\nSüre: '+t.hours+' saat':'')+(t.notes?'\n'+t.notes:'')),
        'CATEGORIES:Planlı bakım');
      if(x.i.lead>=1)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Bakım yaklaşıyor: '+m.tag+' '+t.title),'TRIGGER:-P'+(x.i.lead-1)+'DT16H','END:VALARM');
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Bugün bakım: '+m.tag+' '+t.title),'TRIGGER:PT8H','END:VALARM','END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n')+'\r\n';
}

/* =========================================================
   Bildirimler
   ========================================================= */
async function showNotif(title,body,tag){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return false;
    const reg=('serviceWorker' in navigator)?await navigator.serviceWorker.getRegistration():null;
    if(reg&&reg.showNotification){await reg.showNotification(title,{body:body,tag:tag,icon:'icon.svg',badge:'icon.svg'});return true;}
    new Notification(title,{body:body,tag:tag,icon:'icon.svg'});
    return true;
  }catch(e){return false;}
}
function checkNotify(force){
  try{
    if(!S.settings.notify||notifState()!=='granted')return;
    const ts=iso(today());
    const A=alertItems().filter(x=>force||S.settings.lastNotify[x.t.id]!==ts);
    if(!A.length)return;
    const o=A.filter(x=>x.i.st==='overdue').length,s=A.length-o;
    const title='Planlı Bakım: '+(o?o+' gecikmiş':'')+(o&&s?', ':'')+(s?s+' yaklaşan':'');
    const body=A.slice(0,3).map(x=>x.m.tag+' · '+x.t.title+' ('+dueText(x.i.left)+')').join('\n')+(A.length>3?'\n+'+(A.length-3)+' bakım daha':'');
    showNotif(title,body,'pb-daily').then(ok=>{if(ok&&!force){A.forEach(x=>{S.settings.lastNotify[x.t.id]=ts;});save();}});
  }catch(e){}
}
async function notifyToggle(){
  if(S.settings.notify){S.settings.notify=false;save();render();toast('Bildirimler kapatıldı');return;}
  if(notifState()==='unsupported'){toast('Bu tarayıcı bildirimleri desteklemiyor.');return;}
  let p=Notification.permission;
  try{if(p==='default')p=await Notification.requestPermission();}catch(e){p='denied';}
  S.settings.notify=p==='granted';save();render();
  if(p==='granted'){toast('Bildirimler açıldı');checkNotify(true);}else toast('Bildirim izni verilmedi.');
}

/* =========================================================
   Olaylar
   ========================================================= */
const dayOfYear=()=>{const d=today();return Math.floor((d-new Date(d.getFullYear(),0,0))/DAY);};
const H={
  go:el=>nav(el.dataset.r),
  close:()=>closeDlg(),
  bell:()=>togglePop(),
  'pop-close':()=>{$('#pop').hidden=true;},
  'new-task':el=>taskForm(null,el.dataset.m),
  'edit-task':el=>taskForm(el.dataset.id),
  'open-task':el=>taskDetail(el.dataset.id),
  done:el=>doneForm(el.dataset.id),
  'new-machine':()=>machineForm(),
  'edit-machine':el=>machineForm(el.dataset.id),
  'del-task':el=>deleteTask(el.dataset.id),
  'del-machine':el=>deleteMachine(el.dataset.id),
  'tl-zoom':el=>{S.settings.tlZoom=el.dataset.v;save();render();},
  'tl-class':el=>{S.settings.tlClass=el.dataset.v;save();render();},
  'tl-proj':()=>{S.settings.showProj=!S.settings.showProj;save();render();},
  'flt-st':el=>{UI.st=el.dataset.v;render();},
  'tip-next':()=>{UI.tip=(UI.tip==null?dayOfYear():UI.tip)+1;render();},
  theme:el=>{S.settings.theme=el.dataset.v;save();applyTheme();render();},
  'clear-demo':async()=>{if(await ask('Örnek veri temizlensin mi?','Örnek makineler, planlar ve geçmiş silinir. Ayarların korunur.','Temizle')){S=normalize({demo:false,settings:S.settings});save();render();toast('Örnek veri temizlendi. Makine ekleyerek başlayabilirsin.');}},
  'load-demo':async()=>{if(await ask('Örnek veri yüklensin mi?','Mevcut tüm verinin yerine örnek veri gelir.','Yükle')){const d=demo();d.settings=S.settings;S=normalize(d);save();render();toast('Örnek veri yüklendi');}},
  'reset-all':async()=>{if(await ask('Tüm veriler silinsin mi?','Makineler, planlar ve geçmiş kalıcı olarak silinir. Önce yedek almanı öneririm.','Hepsini sil')){S=normalize({demo:false,settings:S.settings});save();render();toast('Tüm veriler silindi');}},
  'export-json':()=>download('planli-bakim-yedek-'+iso(today())+'.json','application/json',JSON.stringify(exportObj(),null,2)),
  'import-json':()=>{const f=$('#impFile');if(f)f.click();else{nav('ayarlar');}},
  'export-ics':()=>download('planli-bakim.ics','text/calendar',buildICS()),
  'share-link':()=>shareLink(),
  'notify-toggle':()=>notifyToggle(),
  'notify-test':()=>{showNotif('Planlı Bakım','Test bildirimi: uyarılar bu cihazda çalışıyor.','pb-test').then(ok=>toast(ok?'Test bildirimi gönderildi':'Bildirim gönderilemedi'));},
  'copy-text':async()=>{const t=$('#txtOut');if(!t)return;const ok=await copyText(t.value);if(ok)toast('Kopyalandı');else{t.focus();t.select();toast('Metni seçtim, Ctrl+C ile kopyala.');}}
};
document.addEventListener('click',e=>{
  const pop=$('#pop');
  if(!pop.hidden&&!e.target.closest('#pop')&&!e.target.closest('#bellBtn'))pop.hidden=true;
  const el=e.target.closest('[data-act]');
  if(!el||el.closest('dialog')&&el.closest('dialog')!==dlg)return;
  const h=H[el.dataset.act];
  if(!h)return;
  if(el.dataset.act!=='bell'&&el.dataset.act!=='pop-close')pop.hidden=true;
  h(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const p=$('#pop');if(!p.hidden)p.hidden=true;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act][tabindex]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){UI.q=e.target.value;renderPlanList();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fm'){UI.m=t.value;renderPlanList();}
  else if(t.id==='fs'){UI.sort=t.value;renderPlanList();}
  else if(t.dataset&&t.dataset.lead){
    const v=Math.min(365,Math.max(0,parseInt(t.value,10)||0));
    S.settings.lead[t.dataset.lead]=v;t.value=v;save();chrome();toast('Uyarı süresi kaydedildi');
  }else if(t.id==='impFile'&&t.files&&t.files[0]){readImport(t.files[0]);t.value='';}
});
window.addEventListener('hashchange',()=>{
  const h=location.hash.slice(1);
  if(VIEWS[h]&&h!==route){route=h;render();}
});

/* =========================================================
   Başlangıç
   ========================================================= */
function boot(){
  load();applyTheme();
  const h=location.hash.slice(1);
  if(VIEWS[h])route=h;
  render();
  if(h.indexOf('d=')===0)importFromHash(h.slice(2));
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
  }
  setTimeout(()=>checkNotify(),1500);
  setInterval(()=>checkNotify(),30*60*1000);
  let last=iso(today());
  setInterval(()=>{const n=iso(today());if(n!==last){last=n;render();checkNotify();}},60000);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)return;
    last=iso(today());render();checkNotify();
  });
}
boot();
})();
