/* ---- Parolayla korunan Rebul verisi (rebul-veri.enc.json: gzip + PBKDF2 + AES-GCM) ---- */
const SIFRELI='rebul-veri.enc.json',SIFRE_ATLA='planli-bakim.sifre-atla';
let sifreliB=null;
const normPw=s=>String(s).replace(/[\s-]+/g,'').toUpperCase();
async function fetchSifreli(){
  const r=await fetch(SIFRELI,{cache:'no-store'});
  if(!r.ok)throw new Error('yok');
  const b=await r.json();
  if(!b||b.v!==1||!b.salt||!b.iv||!b.data||!(b.iter>0&&b.iter<=2000000))throw new Error('yok');
  return b;
}
async function openSifreli(b,pw){
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:unb64u(b.salt),iterations:b.iter},
    await crypto.subtle.importKey('raw',new TextEncoder().encode(normPw(pw)),'PBKDF2',false,['deriveKey']),
    {name:'AES-GCM',length:256},false,['decrypt']);
  let bytes=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(b.iv)},key,unb64u(b.data)));
  if(b.gz){
    const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    bytes=new Uint8Array(await new Response(ds).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function sifreDlg(b,first){

    (first?'<button type="button" class="btn" id="pwSkip">Örnek veriyle devam et</button>':'<button type="button" class="btn" data-act="close">Vazgeç</button>')
      +'<button type="submit" class="btn primary" id="pwGo">Aç ve yükle</button>','pwFrm'),null,f=>{

      }

const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const fold=l=>{if(l.length<=70)return l;let o=l.slice(0,70);for(let i=70;i<l.length;i+=69)o+='\r\n '+l.slice(i,i+69);return o;};
function buildICS(){
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rebul//Planli Bakim//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Rebul Planlı Bakım'];
  const horizon=addDays(today(),365);
  enriched().forEach(x=>{
    const t=x.t,m=x.m,every=everyOf(t);
    const approx=t.unit==='gun'?every:t.unit==='hafta'?7*every:t.unit==='ay'?30*every:365*every;
    const dates=[x.i.due];
    if(approx>=7){for(let k=1;k<400;k++){const dt=shift(x.i.due,every*k,t.unit,anchorOf(t));if(dt>horizon)break;dates.push(dt);}}
    dates.forEach(dt=>{
      const ds=iso(dt).replace(/-/g,''),de=iso(addDays(dt,1)).replace(/-/g,'');
      L.push('BEGIN:VEVENT','UID:'+t.id+'-'+ds+'@planli-bakim','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+de,
        'SUMMARY:'+icsEsc('['+klass(m)+'] '+m.tag+' · '+t.title),
        'DESCRIPTION:'+icsEsc(m.name+'\n'+(t.cat||'')+(t.owner?'\nSorumlu: '+t.owner:'')+(t.hours?'\nSüre: '+t.hours+' saat':'')+(t.notes?'\n'+t.notes:'')),
        'CATEGORIES:Planlı bakım');
      if(x.i.lead>=1)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Bakım yaklaşıyor: '+m.tag+' '+t.title),'TRIGGER:-P'+(x.i.lead-1)+'DT16H','END:VALARM');
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Bugün bakım: '+m.tag+' '+t.title),'TRIGGER:PT8H','END:VALARM','END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n')+'\r\n';
}

/* Bildirimi önce servis çalışanıyla, olmazsa doğrudan sayfadan gösterir. Sonuç ayrıntısını döndürür. */
async function showNotif(title,body,tag){
  const res={ok:false,path:'',error:'',count:null,perm:notifState()};
  if(res.perm==='unsupported'){res.error='Bu tarayıcı bildirimleri desteklemiyor.';return res;}
  if(res.perm!=='granted'){res.error='Bildirim izni yok ('+res.perm+').';return res;}
  const opt={body:body,tag:tag,icon:'icon-192.png',badge:'icon-192.png',renotify:true};
  let reg=null;
  if('serviceWorker' in navigator){
    try{reg=await navigator.serviceWorker.getRegistration();}catch(e){}
    /* Servis çalışanı ilk ziyarette henüz etkin olmayabilir: en çok 2 sn bekle. */
    if(reg&&!reg.active){
      try{await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(r,2000))]);reg=await navigator.serviceWorker.getRegistration();}catch(e){}
    }
  }
  if(reg&&reg.active&&reg.showNotification){
    try{
      await reg.showNotification(title,opt);
      res.ok=true;res.path='Servis çalışanı';
      try{res.count=(await reg.getNotifications({tag:tag})).length;}catch(e){}
      return res;
    }catch(e){res.error='Servis çalışanı: '+((e&&e.message)||e);}
  }
  try{
    new Notification(title,opt);
    res.ok=true;res.path='Sayfa';
    return res;
  }catch(e){res.error+=(res.error?' · ':'')+'Sayfa: '+((e&&e.message)||e);}
  return res;
}
let lastNotif=null;
function appNotice(title,body,withDiag){
  const old=$('#notice');if(old)old.remove();
  const d=document.createElement('div');
  d.id='notice';d.className='notice';d.setAttribute('role','status');
  d.innerHTML='<span class="ni">'+ic('bell')+'</span><div><b>'+esc(title)+'</b><p>'+esc(body)+'</p>'+(withDiag?'<button type="button" class="btn sm" style="margin-top:8px" data-act="notify-diag">Bildirim gelmedi mi?</button>':'')+'</div><button type="button" class="icon-btn sm" data-act="notice-close" aria-label="Kapat">'+ic('x')+'</button>';
  document.body.appendChild(d);
  setTimeout(()=>{if(d.parentNode)d.remove();},12000);
}
function notifyDiag(r){
  const yes=t=>'<span class="pill good">'+t+'</span>',no=t=>'<span class="pill overdue">'+t+'</span>',mid=t=>'<span class="pill soon">'+t+'</span>';
  const perm={granted:yes('Verildi'),denied:no('Reddedildi'),default:mid('Sorulmadı'),unsupported:no('Desteklenmiyor')}[r.perm]||mid(esc(r.perm));
  const framed=inFrame(),site='https://gurcana4-dev.github.io/planli-bakim/';
  const rows='<dt>Tarayıcı desteği</dt><dd>'+(r.perm==='unsupported'?no('Yok'):yes('Var'))+'</dd>'
    +'<dt>Bildirim izni</dt><dd>'+perm+'</dd>'
    +'<dt>Ortam</dt><dd>'+(framed?mid('Önizleme çerçevesi'):yes('Doğrudan site'))+'</dd>'
    +'<dt>Gönderim yolu</dt><dd>'+(r.path?esc(r.path):'-')+'</dd>'
    +'<dt>Tarayıcıya iletildi</dt><dd>'+(r.ok?yes('Evet')+(r.count!=null?' <span class="faint">('+r.count+' bildirim bekliyor)</span>':''):no('Hayır'))+'</dd>'
    +(r.error?'<dt>Hata</dt><dd>'+esc(r.error)+'</dd>':'');
  let hint;
  if(framed)hint='<b>Bu önizlemede tarayıcı bildirimi çalışmaz.</b> Sayfa bir güvenlik çerçevesi içinde açıldığı için tarayıcı bildirim izni vermez. Yayınlanan siteyi doğrudan aç ve testi orada tekrarla: <a href="'+site+'" target="_blank" rel="noopener">'+site+'</a>';
  else if(r.perm==='unsupported')hint='<b>Bu tarayıcı bildirimleri desteklemiyor.</b> Güncel Edge, Chrome veya Firefox kullan. iPhone ile önce siteyi ana ekrana ekle, uygulamayı oradan aç.';
  else if(r.perm==='denied')hint='<b>Tarayıcı bildirim iznini reddetmiş.</b> Adres çubuğundaki kilit simgesine tıkla, Bu site için izinler bölümünden Bildirimler seçeneğini İzin ver yap, sayfayı yenile ve testi tekrarla.';
  else if(r.perm==='default')hint='<b>Bildirim izni henüz verilmedi.</b> Tarayıcının sorduğu izin kutusunda İzin ver seçeneğini seçip testi tekrarla.';
  else if(r.ok)hint='<b>Tarayıcı bildirimi işletim sistemine iletti.</b> Ekranda göremediysen Windows Ayarlar, Sistem, Bildirimler bölümünde Microsoft Edge (veya Google Chrome) açık olsun, Odak yardımı ve Rahatsız etme kapalı olsun. Bildirim Eylem Merkezinde de görünür. Tarayıcıda adres çubuğundaki kilit simgesi, Bu site için izinler, Bildirimler İzin ver olmalı.';
  else hint='<b>Bildirim tarayıcıya iletilemedi.</b> Yukarıdaki hata ayrıntısına bak, sayfayı yenileyip testi tekrarla.';
  openDlg('<div class="dlg"><div class="dlg-h"><div><h2>Bildirim testi</h2><p>'+(r.ok?'Test bildirimi tarayıcıya iletildi.':'Test bildirimi gönderilemedi.')+'</p></div><button type="button" class="icon-btn" data-act="close" aria-label="Kapat">'+ic('x')+'</button></div><div class="dlg-b diag"><dl class="kv">'+rows+'</dl><div class="hint">'+hint+'</div></div><div class="dlg-f"><button type="button" class="btn" data-act="close">Kapat</button><button type="button" class="btn primary" data-act="notify-test">Tekrar dene</button></div></div>');
}
async function notifyTest(){
  const framed=inFrame();
  let perm=notifState();
  if(perm==='default'&&!framed){try{await Notification.requestPermission();}catch(e){}perm=notifState();}
  if(!framed)toast('Test bildirimi gönderiliyor...');
  const r=framed?{ok:false,path:'',error:'',count:null,perm:perm}:await showNotif('Rebul Planlı Bakım','Test bildirimi: uyarılar bu cihazda çalışıyor.','pb-test-'+Date.now());
  lastNotif=r;
  if(r.ok){
    if(dlg.open)closeDlg();
    appNotice('Rebul Planlı Bakım','Test bildirimi gönderildi. Sistem bildirimini görmediysen aşağıdaki düğmeye bas.',true);
  }else notifyDiag(r);
}
function checkNotify(force){
  try{
    if(!S.settings.notify||notifState()!=='granted')return;
    const ts=iso(today());
    const A=alertItems().filter(x=>force||S.settings.lastNotify[x.t.id]!==ts);
    if(!A.length)return;
    const o=A.filter(x=>x.i.st==='overdue').length,s=A.length-o;
    const title='Planlı Bakım: '+(o?o+' gecikmiş':'')+(o&&s?', ':'')+(s?s+' yaklaşan':'');
    const body=A.slice(0,3).map(x=>x.m.tag+' · '+x.t.title+' ('+dueText(x.i.left)+')').join('\n')+(A.length>3?'\n+'+(A.length-3)+' bakım daha':'');
    showNotif(title,body,'pb-daily').then(r=>{if(r.ok&&!force){A.forEach(x=>{S.settings.lastNotify[x.t.id]=ts;});save();}});
  }catch(e){}
}
async function notifyToggle(){
  if(S.settings.notify){S.settings.notify=false;save();render();toast('Bildirimler kapatıldı');return;}
  if(notifState()==='unsupported'){toast('Bu tarayıcı bildirimleri desteklemiyor.');return;}
  let p=Notification.permission;
  try{if(p==='default')p=await Notification.requestPermission();}catch(e){p='denied';}
  S.settings.notify=p==='granted';save();render();
  if(p==='granted'){toast('Bildirimler açıldı');checkNotify(true);}else toast('Bildirim izni verilmedi. Adres çubuğundaki kilit simgesinden bu site için bildirimlere izin ver.');
}

document.addEventListener('click',e=>{
  const pop=$('#pop');
  if(!pop.hidden&&!e.target.closest('#pop')&&!e.target.closest('#bellBtn'))pop.hidden=true;
  const el=e.target.closest('[data-act]');
  if(!el||el.closest('dialog')&&el.closest('dialog')!==dlg)return;
  const h=H[el.dataset.act];
  if(!h)return;
  if(el.dataset.act!=='bell'&&el.dataset.act!=='pop-close')pop.hidden=true;
  h(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const p=$('#pop');if(!p.hidden)p.hidden=true;}
  if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('new_')===0){
    e.preventDefault();
    const b=e.target.parentElement.querySelector('[data-act="def-add"]');
    if(b)b.click();
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act][tabindex]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){UI.q=e.target.value;renderPlanList();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='tlLine'){UI.tlLine=t.value;render();}
  else if(t.id==='fPeriod'){UI.period=+t.value||90;render();}
  else if(t.id==='fArea'){UI.area=t.value;render();}
  else if(t.id==='fCls'){UI.cls=t.value;render();}
  else if(t.dataset&&t.dataset.target){
    const v=Math.min(100,Math.max(50,parseInt(t.value,10)||90));
    S.settings.target=v;t.value=v;save();chrome();toast('Hedef kaydedildi');
  }
  else if(t.dataset&&t.dataset.def){defChange(t);}
  else if(t.id==='fm'){UI.m=t.value;renderPlanList();}
  else if(t.id==='fs'){UI.sort=t.value;renderPlanList();}
  else if(t.dataset&&t.dataset.lead){
    const v=Math.min(365,Math.max(0,parseInt(t.value,10)||0));
    S.settings.lead[t.dataset.lead]=v;t.value=v;save();chrome();toast('Uyarı süresi kaydedildi');
  }else if(t.id==='impFile'&&t.files&&t.files[0]){readImport(t.files[0]);t.value='';}
});
window.addEventListener('hashchange',()=>{

  if(VIEWS[h]&&h!==route){route=h;render();}
});

/* =========================================================
   Başlangıç
   ========================================================= */
function boot(){
  load();applyTheme();
  const h=location.hash.slice(1);
  if(VIEWS[h])route=h;
  render();
  if(h.indexOf('d=')===0)importFromHash(h.slice(2));
  else sifreliKontrol();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
  }
  setTimeout(()=>checkNotify(),1500);
  setInterval(()=>checkNotify(),30*60*1000);
  let last=iso(today());
  setInterval(()=>{const n=iso(today());if(n!==last){last=n;render();checkNotify();}},60000);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)return;
    last=iso(today());render();checkNotify();
  });
}
boot();
})();
