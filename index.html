<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101722">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rebul Planlı Bakım</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Yerleşim: solda siyah gezinme çubuğu, üstte süzgeçler, altta KPI şeridi, grafik satırları ve uyarı paneli.
   Renk: koyu lacivert zemin, Rebul markasından turuncu vurgu, mavi ikincil. Durum renkleri (kırmızı, sarı, mavi, yeşil) vurgudan ayrı tutulur.
   Yazı: IBM Plex Sans (metin), IBM Plex Mono (sayılar ve etiketler). */
:root{
  --bg:#18212e; --surface:#212c3c; --surface-2:#293648; --surface-3:#34445a; --line:#334359; --line-2:#2a384b;
  --ink:#f1f5fa; --ink-2:#bac7d6; --ink-3:#8c9fb5;
  --accent:#ff7a1a; --accent-ink:#1c0d00; --accent-soft:rgba(255,122,26,.14); --accent-line:rgba(255,122,26,.42);
  --blue:#3b8bff; --cyan:#27c8e0;
  --bad:#ff5d52; --bad-ink:#2a0805; --bad-soft:rgba(255,93,82,.15);
  --warn:#ffc53d; --warn-ink:#2b1f00; --warn-soft:rgba(255,197,61,.15);
  --good:#34d399; --good-soft:rgba(52,211,153,.15);
  --plan:#5b9bff; --plan-ink:#07162d; --plan-soft:rgba(91,155,255,.16);
  --side-bg:#101722; --side-line:#1e2a3a; --side-ink:#b2bfce; --side-ink-3:#7f92a8; --side-hover:#1a2431;
  --shadow:0 14px 44px rgba(0,0,0,.55);
  --font:'IBM Plex Sans',system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --lw:224px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eceff4; --surface:#ffffff; --surface-2:#f4f6f9; --surface-3:#e4e9f0; --line:#d9e0e8; --line-2:#e8ecf2;
    --ink:#0f1824; --ink-2:#42536a; --ink-3:#62748a;
    --accent:#e5610a; --accent-ink:#ffffff; --accent-soft:rgba(229,97,10,.1); --accent-line:rgba(229,97,10,.4);
    --blue:#1f6fe0; --cyan:#0e9fb5;
    --bad:#d3372c; --bad-ink:#ffffff; --bad-soft:rgba(211,55,44,.1);
    --warn:#a96a00; --warn-ink:#ffffff; --warn-soft:rgba(201,134,0,.14);
    --good:#1a8a5c; --good-soft:rgba(26,138,92,.12);
    --plan:#3a62a0; --plan-ink:#ffffff; --plan-soft:rgba(58,98,160,.12);
    --shadow:0 14px 40px rgba(15,24,36,.18);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eceff4; --surface:#ffffff; --surface-2:#f4f6f9; --surface-3:#e4e9f0; --line:#d9e0e8; --line-2:#e8ecf2;
  --ink:#0f1824; --ink-2:#42536a; --ink-3:#62748a;
  --accent:#e5610a; --accent-ink:#ffffff; --accent-soft:rgba(229,97,10,.1); --accent-line:rgba(229,97,10,.4);
  --blue:#1f6fe0; --cyan:#0e9fb5;
  --bad:#d3372c; --bad-ink:#ffffff; --bad-soft:rgba(211,55,44,.1);
  --warn:#a96a00; --warn-ink:#ffffff; --warn-soft:rgba(201,134,0,.14);
  --good:#1a8a5c; --good-soft:rgba(26,138,92,.12);
  --plan:#3a62a0; --plan-ink:#ffffff; --plan-soft:rgba(58,98,160,.12);
  --shadow:0 14px 40px rgba(15,24,36,.18);
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
small{font-size:12px}
b,strong{font-weight:600}
.mono,.tag{font-family:var(--mono)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- Kabuk ---- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px 14px;background:var(--side-bg);border-right:1px solid var(--side-line);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:9px}
.brand-tile{display:grid;place-items:center;height:80px;border-radius:12px;background:#000;border:1px solid #2a384b}
.brand-tile img{width:88px;height:auto;display:block}
.brand-cap{padding:0 4px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--side-ink-3)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;border-radius:8px;background:none;color:var(--side-ink);font-weight:500;font-size:13px;text-align:left}
.nav button:hover{background:var(--side-hover);color:#fff}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.nav .n{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;font:600 11.5px var(--mono);text-align:center;background:var(--warn-soft);color:var(--warn)}
.nav .n.bad{background:var(--bad-soft);color:var(--bad)}
.nav button[aria-current="page"] .n{background:rgba(0,0,0,.28);color:var(--accent-ink)}
.side-foot{margin-top:auto;display:grid;gap:12px}
.st{padding:12px;border-radius:10px;background:var(--side-hover);border:1px solid var(--side-line)}
.st-h{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--side-ink-3)}
.st-v{display:flex;align-items:baseline;gap:7px;margin:6px 0 10px;font:600 24px var(--mono);color:#fff;letter-spacing:-.02em}
.st-v small{font:500 11px var(--font);color:var(--side-ink-3);letter-spacing:0}
.st-bar{position:relative;height:7px;border-radius:99px;background:#2c3a4f}
.st-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#ffb066)}
.st-bar b{position:absolute;top:-3px;width:2px;height:13px;margin-left:-1px;border-radius:1px;background:#fff;opacity:.75}
.st-s{margin-top:8px;font-size:11px;color:var(--side-ink-3)}
.side-note{padding:0 4px;font-size:11.5px;line-height:1.5;color:var(--side-ink-3)}
.side-note b{color:var(--side-ink)}
.side-note .btn{margin-top:8px;background:transparent;border-color:var(--side-line);color:var(--side-ink)}
.side-note .btn:hover{background:var(--side-hover);color:#fff}
.main{min-width:0;padding:0 24px 56px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0 12px;background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}
.top h1{font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.25;text-wrap:balance}
.top p{margin-top:2px;font-size:12px;color:var(--ink-3)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.sel{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 8px 0 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12px}
.sel span{color:var(--ink-3)}
.sel select{width:auto;height:auto;padding:0 2px;border:0;background:transparent;font-weight:600;font-size:12px;color:var(--ink)}
.sel select option{background:var(--surface);color:var(--ink)}
.print-brand{display:none}
.tabbar{display:none}

/* ---- Düğmeler ve girdiler ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.done:hover{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.icon-btn{position:relative;display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn .b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--bad-ink);font:600 11px/18px var(--mono);text-align:center}
.icon-btn .b.warn{background:var(--warn);color:var(--warn-ink)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.fld em{font-style:normal;font-size:12px;color:var(--ink-3)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;min-width:0;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{height:auto;min-height:72px;padding:9px 11px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
#pwIn{font-family:var(--mono);letter-spacing:.06em}
.pw-show{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.pw-err{min-height:1.3em;margin:0;font-size:12.5px;color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ---- Kart, rozet, durum ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-h h2{font-size:15px;letter-spacing:-.01em}
.card-h small{color:var(--ink-3)}
.pad{padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--plan-soft);color:var(--plan)}
.pill.good{background:var(--good-soft);color:var(--good)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--plan)}
.dot.overdue{background:var(--bad)}
.dot.soon{background:var(--warn)}
.dot.none{background:var(--line)}
.cls{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:6px;font:600 12px var(--mono)}
.cls.A{background:var(--ink);color:var(--surface)}
.cls.B{box-shadow:inset 0 0 0 1.5px var(--ink-2);color:var(--ink-2)}
.cls.C{background:var(--line-2);color:var(--ink-3)}
.tag{font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink-2);font-weight:500;font-size:13px}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip i{font:600 11.5px var(--mono);font-style:normal;opacity:.7}
.seg-ctl{display:inline-flex;padding:3px;border-radius:9px;background:var(--line-2);gap:2px}
.seg-ctl button{height:30px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--ink-2);font-weight:600;font-size:12.5px}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .grow{flex:1}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search .ic{position:absolute;left:11px;top:10px;color:var(--ink-3);width:17px;height:17px}
.search input{padding-left:36px}
.toolbar select{width:auto;min-width:150px}
.empty{padding:36px 18px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink)}
.banner p{flex:1 1 260px;font-size:13px}

/* ---- Pano ---- */
.dash{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-h h3{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.panel-h .tg{font:600 10.5px var(--mono);color:var(--accent);white-space:nowrap}
.panel-h .tg.mut{color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:7px;min-height:106px;padding:13px 14px 12px}
.kpi .lab{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);line-height:1.3}
.kpi .krow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1}
.kpi .val{font:600 25px/1 var(--mono);letter-spacing:-.03em}
.kpi .val small{font:500 12px var(--font);color:var(--ink-3);letter-spacing:0;margin-left:3px}
.kpi.bad .val{color:var(--bad)}
.kpi.warn .val{color:var(--warn)}
.kpi .sub{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.delta{font:600 11px var(--mono);white-space:nowrap}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.ring,.spark,.chart{display:block;flex:none}
.chart{width:100%;height:auto}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-3b{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.95fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hb{display:grid;gap:12px}
.hb-row{display:grid;grid-template-columns:minmax(0,92px) minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:12px}
.hb-row .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:17px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hb-fill{display:flex;height:100%;gap:2px}
.hb-fill i{display:block;min-width:3px;height:100%}
.hb-fill .o{background:var(--bad)}
.hb-fill .s{background:var(--warn)}
.hb-fill .k{background:var(--plan)}
.hb-row b{font:600 12px var(--mono);text-align:right}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:11.5px;color:var(--ink-2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px}
.donut{display:grid;grid-template-columns:148px minmax(0,1fr);gap:14px;align-items:center}
.dn-leg{display:grid;gap:8px;font-size:12px}
.dn-leg li{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center}
.dn-leg i{width:9px;height:9px;border-radius:3px}
.dn-leg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.dn-leg b{font:600 11.5px var(--mono)}
.tw{overflow-x:auto}
.mt{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
.mt th{padding:6px 8px;border-bottom:1px solid var(--line);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;white-space:nowrap}
.mt td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.mt tr[data-act]{cursor:pointer}
.mt tbody tr:hover td{background:var(--surface-2)}
.mt tr:last-child td{border-bottom:0}
.mt .r{text-align:right;font-family:var(--mono)}
.mt .rk{font:600 12px var(--mono);color:var(--ink-3);width:24px}
.mt .nm b{display:block;font-weight:600}
.mt .nm small{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.mt .cl{display:flex;align-items:center;gap:7px;font:500 11.5px var(--mono);color:var(--ink-2)}
.mt .dn{white-space:nowrap}
.mt .dn.overdue{color:var(--bad)}
.mt .dn.soon{color:var(--warn)}
.mt .dn small{display:block;color:var(--ink-3)}
.pc{display:flex;align-items:center;gap:7px;font:600 11.5px var(--mono);min-width:74px}
.pc i{display:block;flex:1;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.pc i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:99px;background:var(--c)}
.al{display:grid;gap:2px}
.al-row{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer}
.al-row:hover{background:var(--surface-2)}
.al-row .t{min-width:0}
.al-row .t b,.al-row .t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-row .t b{font-size:12.5px;font-weight:600}
.al-row .t small{font:500 10.5px var(--mono);color:var(--ink-3)}
.al-row .d{font:600 11px var(--mono);white-space:nowrap}
.al-row .d.overdue{color:var(--bad)}
.al-row .d.soon{color:var(--warn)}
.al-row .d.ok{color:var(--ink-3)}
.ins{display:grid;gap:8px;margin-top:12px}
.ins>div{display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;padding:9px 11px;border-radius:9px;font-size:12px;line-height:1.45;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line)}
.ins b{color:var(--ink);font-weight:600}
.ins .ic{width:16px;height:16px;margin-top:1px}
.ins .bad{background:var(--bad-soft);border-color:color-mix(in oklab,var(--bad) 40%,transparent)}
.ins .bad .ic{color:var(--bad)}
.ins .warn{background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 40%,transparent)}
.ins .warn .ic{color:var(--warn)}
.ins .good{background:var(--good-soft);border-color:color-mix(in oklab,var(--good) 40%,transparent)}
.ins .good .ic{color:var(--good)}
.fc{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:13px 15px}
.fc-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.fc-ic .ic{width:19px;height:19px}
.fc .lab{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.fc .v{margin-top:2px;font:600 16px/1.2 var(--mono);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc .s{margin-top:2px;font-size:11.5px;color:var(--ink-3);line-height:1.4}
.fc .s button{padding:0;border:0;background:none;color:var(--accent);font-weight:600;font-size:11.5px;text-decoration:underline;text-underline-offset:2px}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.mstats>div{padding:9px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line-2)}
.mstats small{display:block;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.mstats b{display:block;margin-top:2px;font:600 17px var(--mono);letter-spacing:-.02em}
.demo-note{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:12.5px}
.demo-note span{flex:1 1 260px;color:var(--ink-2)}
.demo-note b{color:var(--ink)}

/* ---- Zaman çizelgesi: takvim ve ajanda ---- */
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 12px;color:var(--ink-2);font-size:12.5px}
.tl-legend span{display:inline-flex;align-items:center;gap:7px}
.tl-legend i{display:inline-block;width:16px;height:10px;border-radius:5px}
.tl-legend .l-o{background:var(--bad)}
.tl-legend .l-s{background:var(--warn)}
.tl-legend .l-k{background:var(--plan)}
.cal{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.cal-m{padding:14px}
.cal-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.cal-h h3{font-size:16px;letter-spacing:-.01em}
.cal-h small{color:var(--ink-3)}
.nv{display:flex;gap:6px}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cg .dh{padding:7px 4px;background:var(--surface-2);text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dc{display:flex;flex-direction:column;gap:3px;min-height:100px;padding:6px;background:var(--surface);cursor:pointer;min-width:0;border:0;text-align:left;color:inherit}
.dc.out{background:var(--bg);opacity:.55}
.dc:hover{background:var(--surface-2)}
.dc .n{align-self:flex-start;display:grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:11px;font:600 12px var(--mono);color:var(--ink-2)}
.dc.today .n{background:var(--accent);color:var(--accent-ink)}
.dc.sel{outline:2px solid var(--accent);outline-offset:-2px}
.ch{display:block;padding:2px 5px;border-radius:5px;font:600 10.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.o{--c:var(--bad);--ci:var(--bad-ink)}
.ch.s{--c:var(--warn);--ci:var(--warn-ink)}
.ch.k{--c:var(--plan);--ci:var(--plan-ink)}
.ch{background:color-mix(in oklab,var(--c) 20%,transparent);color:var(--c)}
.ch.fi{background:var(--c);color:var(--ci)}
.dc .more{font:600 10.5px var(--mono);color:var(--ink-3)}
.dc .more.o{color:var(--bad)}
.ag{display:grid;gap:12px}
.ag-b{padding:12px 14px}
.ag h4{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ag h4 em{font-style:normal;color:var(--bad)}
.ag-e{font-size:12.5px}
.ai{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 4px;border-top:1px solid var(--line-2);cursor:pointer;border-radius:6px}
.ai:first-of-type{border-top:0}
.ai:hover{background:var(--surface-2)}
.ai .ai-t{min-width:0}
.ai .ai-t b,.ai .ai-t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai .ai-t b{font-size:12.5px;font-weight:600}
.ai .ai-t small{color:var(--ink-3);font:500 10.5px var(--mono)}
.ai-s{padding:2px 8px;border-radius:99px;font:600 10.5px var(--mono);white-space:nowrap;background:var(--plan-soft);color:var(--plan)}
.ai.overdue .ai-s{background:var(--bad-soft);color:var(--bad)}
.ai.soon .ai-s{background:var(--warn-soft);color:var(--warn)}

/* ---- Makineler ---- */
.mlist{overflow:hidden}
.mrow{display:grid;grid-template-columns:44px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:16px;align-items:center;padding:14px 18px}
.mrow+.mrow{border-top:1px solid var(--line-2)}
.mrow .big{font:600 22px var(--mono);color:var(--ink-3);letter-spacing:-.03em}
.mrow:nth-child(-n+3) .big{color:var(--ink)}
.m-name b{display:block}
.m-name small{color:var(--ink-3);font-family:var(--mono);font-size:11.5px}
.m-score{display:flex;align-items:center;gap:10px}
.facs{display:inline-flex;align-items:flex-end;gap:3px;height:22px}
.facs i{display:block;width:5px;border-radius:2px;background:var(--ink-3);opacity:.85}
.m-score small{font:500 12px var(--mono);color:var(--ink-2);white-space:nowrap}
.m-next small{display:block;color:var(--ink-3);margin-top:3px}
.m-act{display:flex;gap:6px}
.howto{margin-bottom:14px;padding:14px 16px;font-size:13px;color:var(--ink-2)}
.howto b{color:var(--ink)}

/* ---- Planlar ---- */
.plist{overflow:hidden}
.prow{display:grid;grid-template-columns:116px minmax(0,1.1fr) minmax(0,1.4fr) 128px 150px auto;gap:14px;align-items:center;padding:12px 18px;cursor:pointer}
.prow:hover{background:var(--surface-2)}
.prow+.prow{border-top:1px solid var(--line-2)}
.prow .p-m{min-width:0}
.prow .p-t{min-width:0}
.prow .p-m b,.prow .p-m small,.prow .p-t b,.prow .p-t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .p-m small,.prow .p-t small,.prow .p-f,.prow .p-d small{color:var(--ink-3)}
.prow .p-f{font-size:13px;color:var(--ink-2)}
.prow .p-d b{display:block;font-size:13px}
.prow .p-d.overdue b{color:var(--bad)}
.prow .p-d.soon b{color:var(--warn)}
.p-act{display:flex;gap:6px}

/* ---- Geçmiş ---- */
.hrow{display:grid;grid-template-columns:96px minmax(0,1.2fr) minmax(0,1.4fr) 130px minmax(0,1fr);gap:14px;align-items:center;padding:12px 18px}
.hrow+.hrow{border-top:1px solid var(--line-2)}
.hrow b,.hrow small{display:block}
.hrow small{color:var(--ink-3)}
.hsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.hsum .card{padding:16px 18px}

/* ---- Rehber ---- */
.guide{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:880px}
.guide section{padding:22px 24px}
.guide h2{font-size:17px;letter-spacing:-.015em;margin-bottom:6px}
.guide .lead{color:var(--ink-2);margin-bottom:14px;max-width:68ch}
.guide p{max-width:68ch;color:var(--ink-2)}
.steps{display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 13px var(--mono)}
.steps b{display:block}
.steps span{color:var(--ink-2)}
.tbl{overflow-x:auto;margin-top:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;padding:8px 10px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:nth-child(-n+4){white-space:nowrap}
.rules{display:grid;gap:14px}
.rules li{max-width:68ch}
.rules b{display:block;color:var(--ink);margin-bottom:2px}
.rules span{color:var(--ink-2)}
.factors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.factors div{padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.factors b{display:block;font-size:13px}
.factors span{font-size:12.5px;color:var(--ink-2)}

/* ---- Ayarlar ---- */
.set{display:grid;gap:16px;max-width:820px}
.set section{padding:20px 22px}
.set h2{font-size:15px;margin-bottom:4px}
.set .sub{color:var(--ink-2);font-size:13px;margin-bottom:14px;max-width:62ch}
.set .btns{display:flex;flex-wrap:wrap;gap:8px}
.set .row3{max-width:480px}
.note{margin-top:10px;font-size:12.5px;color:var(--ink-3);max-width:62ch}
.ok-txt{color:var(--good);font-weight:600}

/* ---- Pencere, açılır panel, toast ---- */
dialog{padding:0;border:0;border-radius:14px;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,15,22,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 4px}
.dlg-h h2{font-size:17px;letter-spacing:-.015em;line-height:1.3}
.dlg-h p{color:var(--ink-3);font-size:13px;margin-top:2px}
.dlg-b{padding:14px 20px 8px;overflow-y:auto;display:grid;gap:14px}
.dlg-f{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 20px 18px}
.dlg-f .sp{margin-right:auto}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mini{display:grid;gap:6px;font-size:13px}
.mini li{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:8px;background:var(--surface-2)}
.mini li small{color:var(--ink-3)}
.dlg h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.scoreprev{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent-line)}
.scoreprev b{font:600 20px var(--mono)}
.scoreprev span{font-size:13px;color:var(--ink-2)}
.pop{position:fixed;z-index:60;top:68px;right:max(16px,calc((100vw - 1400px)/2 + 16px));width:min(400px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.pop-h b{font-size:14px}
.pop .it{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;cursor:pointer}
.pop .it:hover{background:var(--surface-2)}
.pop .it+.it{border-top:1px solid var(--line-2)}
.pop .it b,.pop .it small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .it small{color:var(--ink-3)}
.pop-f{padding:10px 16px 14px}
.toast{position:fixed;left:50%;bottom:24px;z-index:80;transform:translate(-50%,20px);max-width:calc(100vw - 32px);padding:11px 18px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
textarea.code{height:220px;font:12px/1.5 var(--mono)}

/* ---- Ayarlar: tanımlar ---- */
.set{max-width:920px}
.stabs{display:flex;gap:4px;overflow-x:auto;padding:4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:none;height:34px;padding:0 14px;border:0;border-radius:7px;background:none;color:var(--ink-2);font-weight:600;font-size:12.5px;white-space:nowrap}
.stabs button:hover{color:var(--ink)}
.stabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.deflist{display:grid}
.defrow{display:grid;grid-template-columns:minmax(0,1fr) 178px 84px 34px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.defrow:last-child{border-bottom:0}
.defrow.s{grid-template-columns:minmax(0,1fr) 84px 34px}
.defrow.m{grid-template-columns:26px minmax(0,1fr) 200px 92px auto}
.defrow.cl{grid-template-columns:26px minmax(0,1fr) 170px 150px;align-items:end}
.defrow .cnt{font:500 12px var(--mono);color:var(--ink-3);text-align:right;white-space:nowrap}
.defrow .rk{font:600 12px var(--mono);color:var(--ink-3)}
.defrow .mn{min-width:0}
.defrow .mn b,.defrow .mn small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.defrow .mn small{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.defrow.cl .cls{align-self:center;margin-bottom:6px}
.cls-wrap{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--ink-2)}
.defadd{display:flex;gap:8px;margin-top:14px}
.defadd input{flex:1}
.icon-btn.sm{width:34px;height:34px}
.mini-fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.mini-fld>span{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-3)}
.mini-fld .ro{display:flex;align-items:center;height:38px;padding:0 11px;border-radius:8px;border:1px dashed var(--line);color:var(--ink-3);font-size:12.5px}
.fcard{display:grid;gap:9px;padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.fc-top{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center}
.fc-n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 12px var(--mono)}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.chk{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.chk h3{margin-bottom:6px}
.chk-u{margin-top:10px;padding:2px 0;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.chk-r{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2)}
.chk-r b{display:block;font-size:12.5px;font-weight:600}
.chk-r small{color:var(--ink-3);font-size:11px}
.chk-r select{height:32px;font-size:12.5px}
.chk-r.bad select{border-color:var(--bad);color:var(--bad)}
.chk-d{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.chk-d summary{cursor:pointer;font-weight:600;font-size:13px}
.chk-d .mini{margin-top:10px;max-height:240px;overflow:auto}
.copts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.optrow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}

/* ---- Bildirim bandı ve tanı penceresi ---- */
.notice{position:fixed;top:72px;right:16px;z-index:70;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;width:min(390px,calc(100vw - 32px));padding:12px 12px 12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--accent-line);box-shadow:var(--shadow)}
.notice .ni{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.notice b{display:block;font-size:13px}
.notice p{margin-top:2px;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.diag{display:grid;gap:12px}
.diag .hint{padding:10px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.diag .hint b{color:var(--ink)}
.diag .hint a{color:var(--accent);word-break:break-all}

/* ---- Ortak düzeltmeler ---- */
.card-h h2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.toast{background:var(--ink);color:var(--bg)}
select option{background:var(--surface);color:var(--ink)}

/* ---- Dar ekran ---- */
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1180px){
  .cal{grid-template-columns:minmax(0,1fr)}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3>:nth-child(3){grid-column:1/-1}
  .grid-3b{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3b>:nth-child(1){grid-column:1/-1}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:116px minmax(0,1fr) minmax(0,1fr) 132px auto}
  .prow .p-f{display:none}
}
@media (max-width:860px){
  :root{--lw:150px}
  .app{display:block}
  .side{display:none}
  .main{padding:0 16px 96px}
  .top{flex-wrap:wrap;padding:12px 0 10px;gap:10px}
  .top h1{font-size:15px}
  .top-t{flex:1;min-width:0}
  .print-brand{display:block}
  .print-brand .brand-tile{width:62px;height:42px;border-radius:9px}
  .print-brand .brand-tile img{width:46px}
  .top-actions{width:100%;justify-content:flex-start}
  .filters{flex:1 1 100%;order:3;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .sel{flex:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--side-bg);border-top:1px solid var(--side-line);gap:2px;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{position:relative;flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:0;border-radius:8px;background:none;color:var(--side-ink-3);font-size:11px;font-weight:600}
  .tabbar button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
  .tabbar .n{position:absolute;top:2px;right:12px;min-width:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:var(--bad-ink);font:600 10px/16px var(--mono)}
  .dc{min-height:64px;padding:4px}
  .ch{font-size:9.5px;padding:1px 3px}
  .cal-m{padding:10px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .val{font-size:22px}
  .grid-3,.grid-3b{grid-template-columns:minmax(0,1fr)}
  .grid-3>:nth-child(3),.grid-3b>:nth-child(1){grid-column:auto}
  .grid-4{gap:10px}
  .donut{grid-template-columns:128px minmax(0,1fr)}
  .btn.primary .lbl{display:none}
  .btn.primary{padding:0 11px}
  .mrow{grid-template-columns:34px minmax(0,1fr) auto;gap:8px 12px;padding:14px}
  .mrow .m-score{grid-column:2;grid-row:2}
  .mrow .m-next{grid-column:2/4;grid-row:3}
  .mrow .m-act{grid-column:3;grid-row:1}
  .mrow .big{font-size:18px;align-self:start}
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px}
  .prow .p-s{grid-column:1;grid-row:1}
  .prow .p-t{grid-column:1/3;grid-row:2}
  .prow .p-m{grid-column:1/3;grid-row:3}
  .prow .p-d{grid-column:2;grid-row:1;text-align:right}
  .prow .p-act{grid-column:1/3;grid-row:4;margin-top:4px}
  .hrow{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .hrow>*:nth-child(1){grid-column:1;grid-row:1}
  .hrow>*:nth-child(4){grid-column:2;grid-row:1}
  .hrow>*:nth-child(2){grid-column:1/3}
  .hrow>*:nth-child(3){grid-column:1/3}
  .hrow>*:nth-child(5){grid-column:1/3}
  .hsum{grid-template-columns:minmax(0,1fr)}
  .factors{grid-template-columns:minmax(0,1fr)}
  .guide section{padding:18px}
  .row3{grid-template-columns:minmax(0,1fr)}
  .toast{bottom:84px}
  .pop{right:16px;top:60px}
  .set section{padding:18px}

<script>
(function(){
'use strict';

/* =========================================================
   Yardımcılar
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const parseD=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const diff=(a,b)=>Math.round((a-b)/DAY);
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
function shift(d,n,unit,anchor){
  if(unit==='gun')return addDays(d,n);
  if(unit==='hafta')return addDays(d,7*n);
  const months=unit==='yil'?12*n:n;
  const r=new Date(d.getFullYear(),d.getMonth()+months,1);
  const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();
  r.setDate(Math.min(anchor||d.getDate(),last));
  return r;
}
/* Ay sonuna denk gelen sabit takvimli bakımlar (ör. 31'i) kaymasın diye ilk gün saklanır. */
const anchorOf=t=>t.mode==='after'?0:(+t.day||0);
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MON_S=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const DOW=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const fmtDate=d=>d.getDate()+' '+MON_S[d.getMonth()]+' '+d.getFullYear();
const fmtShort=d=>d.getDate()+' '+MON_S[d.getMonth()];
const fmtLong=d=>d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+' '+DOW[d.getDay()];
const trLower=s=>String(s).toLocaleLowerCase('tr');

/* =========================================================
   Sabitler ve bilgi metinleri
   ========================================================= */
const UNIT={gun:'gün',hafta:'hafta',ay:'ay',yil:'yıl'};
const LOC={gun:'günde',hafta:'haftada',ay:'ayda',yil:'yılda'};
const ADJ={gun:'Günlük',hafta:'Haftalık',ay:'Aylık',yil:'Yıllık'};
const STLAB={overdue:'Gecikmiş',soon:'Yaklaşıyor',ok:'Planlı'};
const STORD={overdue:0,soon:1,ok:2};
const CATS=['Yağlama','Kontrol ve muayene','Filtre ve sarf değişimi','Temizlik','Kalibrasyon','Yasal periyodik kontrol','Genel revizyon','Diğer'];
const TITLE_SUG=['Yağlama (gresleme noktaları)','Yağ seviyesi ve sızıntı kontrolü','Hava filtresi değişimi','Hidrolik yağ filtresi değişimi','Kayış ve zincir gerginlik kontrolü','Rulman titreşim ölçümü','Emniyet ventili ve basınç kontrolü','Elektrik pano termal kamera taraması','Topraklama ve izolasyon ölçümü','Kalibrasyon (manometre, sensör)','Soğutma sıvısı değişimi','Acil durdurma ve emniyet devreleri testi','Genel temizlik ve görsel kontrol','Yasal periyodik muayene'];
/* Rebul ekipman önem seviyesi: "Üretim üzerine etkisi" ile "Bakım ve kalite üzerine etkisi" ayrı puanlanır.
   Üretim puanı 100 ise A, 75 ise B, aksi halde C. Bakım ve kalite toplamı 75 ve üzeriyse A, 50 ve üzeriyse B, aksi halde C.
   Sonuç iki seviyenin yüksek olanıdır. */
const CRIT_DEFAULT={
  prod:{t:'Üretim üzerine etkisi',opts:[['Tolere edilebilir kapasite düşüşü',25],['Siparişte gecikme',75],['Müşteri sipariş iptali',100]]},
  mq:[
    {k:'age',t:'Ekipman yaşı',opts:[['3 yaşından küçük',10],['3 yaşından büyük',15],['6 yaşından büyük',20]]},
    {k:'parts',t:'Hareketli parça sayısı',opts:[["5'ten az",5],['5-10 arası',10],["10'dan fazla",15]]},
    {k:'vib',t:'Hız ve vibrasyon',opts:[['Az',5],['Orta',10],['Çok',15]]},
    {k:'qual',t:'Kalite üzerine etkisi',opts:[['Az',5],['Orta',15],['Çok',30]]},
    {k:'env',t:'Çevresel koşul (toz, nem, ısı, sıvı)',opts:[['Az',5],['Orta',10],['Çok',20]]}
  ],
  cut:{prodA:100,prodB:75,mqA:75,mqB:50}
};
const TIPS=[
  {t:'Her makineyi A sınıfı yapma',b:'A sınıfı makineler toplamın yaklaşık beşte biri olmalı. Hepsi kritikse hiçbiri kritik değildir. Ekip öncelik veremez ve gecikmeler kontrolsüz birikir.'},
  {t:'Uyarı süresi, işin hazırlık süresi kadar olmalı',b:'Yedek parça temini, iş emri hazırlığı ve duruş izni toplamı kadar önceden uyarı al. Parçası ithal gelen bir makinede 3 gün önceden gelen uyarı, geç kalmış uyarıdır.'},
  {t:'Küçük ve sık, büyük ve nadirden iyidir',b:'Haftalık on beş dakikalık yağlama ve görsel kontrol, yılda bir yapılan büyük revizyondan daha çok arıza önler. Büyük işi küçük parçalara böl.'},
  {t:'Yasal muayeneleri ayrı izle',b:'Basınçlı kap, kaldırma-taşıma ekipmanı ve elektrik tesisatı gibi yasal periyodu olan işlerde gecikme tolere edilmez. Kategoriyi "Yasal periyodik kontrol" seç ve uyarı süresini uzun tut.'},
  {t:'Gecikmenin nedenini yaz',b:'Aynı plan üst üste gecikiyorsa sorun plandadır: süre gerçekçi değil, kaynak yok ya da duruş izni alınamıyor. Nedeni yazmadan çözemezsin.'},
  {t:'İş tanımı ölçülebilir olsun',b:'"Hidrolik sistemi kontrol et" yerine "yağ seviyesi min çizgisinin üstünde, çalışma basıncı 160 bar, sızıntı yok" yaz. Yapan kişi değişse bile iş aynı yapılır.'},
  {t:'Tamamlarken bulguyu not düş',b:'"Yapıldı" notları arıza analizinin ham verisidir. Üç ayda üç kez "keçe terliyor" yazıldıysa, arıza gelmeden parçayı değiştir.'},
  {t:'Aylık gözden geçirmeyi atlama',b:'Hiç bulgu çıkmayan bakımı seyrelt, sürekli bulgu çıkanı sıklaştır. Plan canlı bir belgedir. Yılda bir yazıp bırakılan plan, bir süre sonra gerçeği anlatmaz.'},
  {t:'Takvimi duruş pencereleriyle kur',b:'Bayram, yıllık duruş ve model değişikliği tarihlerini önceden gör. Ağır bakımları bu pencerelere taşı, üretimin en yoğun haftasına denk getirme.'},
  {t:'Her planın tek bir sorumlusu olsun',b:'"Bakım ekibi" sorumlu değildir, bir kişidir. İsmi yazılı plan kaybolmaz. Gecikince kime sorulacağı da bellidir.'}
];

/* =========================================================
   Durum ve kayıt
   ========================================================= */
const KEY='planli-bakim.v1';
let S=null,memOnly=false;
const UI={q:'',st:'all',m:'all',sort:'prio',period:90,area:'all',cls:'all',calMode:'roll',tlLine:'all',selD:null,calR:null,calM:null};
let route='genel';

const defaults=()=>({lead:{A:14,B:7,C:3},theme:'dark',target:90,ui:2,notify:false,lastNotify:{},tlZoom:'ay3',tlClass:'all',showProj:true});
/* Tanımlar: hatlar, önem sınıfı eşikleri ve adları, önem faktörleri, bakım türleri, sorumlular. */
function normalizeDefs(d,machines,tasks){
  d=d||{};
  const uniq=a=>Array.from(new Set(a.filter(Boolean)));
  const lines=(Array.isArray(d.lines)?d.lines:[]).filter(l=>l&&l.name).map(l=>({name:String(l.name),imp:Math.min(5,Math.max(1,Math.round(+l.imp)||3))}));
  uniq(machines.map(m=>m.area)).forEach(a=>{if(!lines.some(l=>l.name===a))lines.push({name:a,imp:3});});
  lines.sort((a,b)=>b.imp-a.imp||a.name.localeCompare(b.name,'tr'));
  const cats=Array.isArray(d.cats)&&d.cats.length?d.cats.map(String):CATS.slice();
  uniq(tasks.map(t=>t.cat)).forEach(c=>{if(cats.indexOf(c)<0)cats.push(c);});
  const owners=Array.isArray(d.owners)?d.owners.map(String):[];
  uniq(tasks.map(t=>t.owner)).forEach(o=>{if(owners.indexOf(o)<0)owners.push(o);});
  const dc=d.crit||{};
  const optsOf=(s,f)=>f.opts.map((o,j)=>{
    const so=s&&Array.isArray(s.opts)?s.opts[j]:null;
    return [so&&so[0]?String(so[0]):o[0],so&&isFinite(+so[1])?Math.max(0,Math.round(+so[1])):o[1]];
  });
  const crit={
    prod:{t:dc.prod&&dc.prod.t?String(dc.prod.t):CRIT_DEFAULT.prod.t,opts:optsOf(dc.prod,CRIT_DEFAULT.prod)},
    mq:CRIT_DEFAULT.mq.map(f=>{const s=Array.isArray(dc.mq)?dc.mq.find(x=>x&&x.k===f.k):null;return {k:f.k,t:s&&s.t?String(s.t):f.t,opts:optsOf(s,f)};}),
    cut:Object.assign({},CRIT_DEFAULT.cut,dc.cut||{})
  };
  ['prodA','prodB','mqA','mqB'].forEach(k=>{crit.cut[k]=Math.max(1,Math.round(+crit.cut[k])||CRIT_DEFAULT.cut[k]);});
  if(crit.cut.prodB>=crit.cut.prodA)crit.cut.prodB=Math.max(1,crit.cut.prodA-1);
  if(crit.cut.mqB>=crit.cut.mqA)crit.cut.mqB=Math.max(1,crit.cut.mqA-1);
  const clsName=Object.assign({A:'Kritik',B:'Önemli',C:'Normal'},d.clsName||{});
  return {lines:lines,cats:cats,owners:owners,crit:crit,clsName:clsName};
}
let _rk=null,_rkMap=null;
function applyDefs(){_rk=null;_rkMap=null;}
/* Eski kayıtlardaki dört faktörlü puanı Rebul kriterlerine yaklaşık çevirir. */
const legacyCrit=m=>{
  const p=+m.production||3,r=+m.repair||3,s=+m.safety||3;
  return {prod:p>=5?100:p>=3?75:25,age:15,parts:10,vib:r>=4?15:r>=3?10:5,qual:s>=5?30:s>=3?15:5,env:10};
};
function normalize(o){
  o=o||{};
  const s=Object.assign(defaults(),o.settings||{});
  s.lead=Object.assign({A:14,B:7,C:3},s.lead||{});
  s.lastNotify=s.lastNotify||{};
  const machines=Array.isArray(o.machines)?o.machines:[],tasks=Array.isArray(o.tasks)?o.tasks:[];
  machines.forEach(m=>{if(!m.c||typeof m.c!=='object')m.c=legacyCrit(m);});
  return {v:1,demo:!!o.demo,machines:machines,tasks:tasks,history:Array.isArray(o.history)?o.history:[],settings:s,defs:normalizeDefs(o.defs,machines,tasks)};
}
function save(){
  applyDefs();
  try{localStorage.setItem(KEY,JSON.stringify(S));memOnly=false;}catch(e){memOnly=true;}
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){memOnly=true;}
  if(raw){
    try{
      const o=JSON.parse(raw);
      S=normalize(o);
      /* Yeni tasarıma geçişte eski kayıtlar da koyu temayla açılır. */
      if(!(o.settings&&o.settings.ui===2)){S.settings.theme='dark';S.settings.ui=2;save();}
    }catch(e){S=null;}
  }
  if(!S){S=normalize(demo());save();}
  applyDefs();
}

/* =========================================================
   Hesaplamalar
   ========================================================= */
const mById=id=>S.machines.find(m=>m.id===id);
const CO={A:0,B:1,C:2};
const prodPts=m=>(m.c&&+m.c.prod)||0;
const mqPts=m=>S.defs.crit.mq.reduce((a,f)=>a+((m.c&&+m.c[f.k])||0),0);
const lvl=(p,a,b)=>p>=a?'A':p>=b?'B':'C';
const prodLvl=m=>lvl(prodPts(m),S.defs.crit.cut.prodA,S.defs.crit.cut.prodB);
const mqLvl=m=>lvl(mqPts(m),S.defs.crit.cut.mqA,S.defs.crit.cut.mqB);
const klass=m=>{const a=prodLvl(m),b=mqLvl(m);return a<b?a:b;};
const critText=m=>prodPts(m)+' + '+mqPts(m);
const critRule=()=>{const c=S.defs.crit.cut;return 'Önem seviyesi iki ayrı puanla belirlenir. <b>Üretim üzerine etkisi</b> '+c.prodA+' puansa A, '+c.prodB+' puansa B, altı C. <b>Bakım ve kalite etkisi</b> (ekipman yaşı, hareketli parça, hız ve vibrasyon, kalite, çevre) toplamı '+c.mqA+' ve üzeriyse A, '+c.mqB+' ve üzeriyse B, altı C. Makinenin sınıfı bu ikisinden yüksek olanıdır.';};
const lineImp=name=>{const l=S.defs.lines.find(x=>x.name===name);return l?l.imp:3;};
const cmpImp=(a,b)=>CO[klass(a)]-CO[klass(b)]||prodPts(b)-prodPts(a)||mqPts(b)-mqPts(a)||lineImp(b.area)-lineImp(a.area)||a.name.localeCompare(b.name,'tr');
const ranked=()=>_rk||(_rk=S.machines.slice().sort(cmpImp));
const rankOf=id=>{if(!_rkMap){_rkMap={};ranked().forEach((m,i)=>{_rkMap[m.id]=i+1;});}return _rkMap[id]||0;};
const everyOf=t=>Math.max(1,Math.floor(Number(t.every))||1);
function leadOf(t){
  if(t.lead!==null&&t.lead!==undefined&&t.lead!==''&&!isNaN(+t.lead))return Math.max(0,+t.lead);
  const m=mById(t.machineId);
  return S.settings.lead[m?klass(m):'C'];
}
function info(t){
  const due=parseD(t.due);
  const left=diff(due,today());
  const lead=leadOf(t);
  const st=left<0?'overdue':left<=lead?'soon':'ok';
  return {due,left,lead,st};
}
function enriched(){
  const out=[];
  S.tasks.forEach(t=>{const m=mById(t.machineId);if(m)out.push({t,m,i:info(t)});});
  return out;
}
const prio=(a,b)=>STORD[a.i.st]-STORD[b.i.st]||cmpImp(a.m,b.m)||a.i.left-b.i.left;
function nextDue(t,doneD){
  const every=everyOf(t);
  if(t.mode==='after')return shift(doneD,every,t.unit);
  const due=parseD(t.due);
  let n=1,nd=shift(due,every*n,t.unit,anchorOf(t));
  while(nd<=doneD&&n<1000){n++;nd=shift(due,every*n,t.unit,anchorOf(t));}
  return nd;
}
const ensureOwner=n=>{if(n&&S.defs.owners.indexOf(n)<0)S.defs.owners.push(n);};
function complete(taskId,doneISO,by,note,chk){
  const t=S.tasks.find(x=>x.id===taskId);
  if(!t)return null;
  const m=mById(t.machineId);
  S.history.unshift({id:uid(),taskId:t.id,machineId:t.machineId,tag:m?m.tag:'',mname:m?m.name:'',title:t.title,due:t.due,done:doneISO,by:by||'',note:note||'',chk:chk||null});
  const nd=nextDue(t,parseD(doneISO));
  t.due=iso(nd);
  if(by){t.owner=by;ensureOwner(by);}
  save();
  return nd;
}
function compliance(){
  const from=addDays(today(),-90);
  const hs=S.history.filter(h=>parseD(h.done)>=from);
  const ontime=hs.filter(h=>h.done<=h.due).length;
  const ov=enriched().filter(x=>x.i.st==='overdue'&&x.i.left>=-90).length;
  const n=hs.length+ov;
  return n?{pct:Math.round(ontime/n*100),ontime,n}:null;
}
function worst(mid,E){
  const l=E.filter(x=>x.t.machineId===mid);
  if(!l.length)return 'none';
  return l.some(x=>x.i.st==='overdue')?'overdue':l.some(x=>x.i.st==='soon')?'soon':'ok';
}
function alertItems(){return enriched().filter(x=>x.i.st!=='ok').sort(prio);}

function dashCtx(){
  const P=UI.period,T0=today();
  const area=m=>m.area||'Diğer';
  const ms=S.machines.filter(m=>(UI.area==='all'||area(m)===UI.area)&&(UI.cls==='all'||klass(m)===UI.cls));
  const ids=new Set(ms.map(m=>m.id));
  const E=enriched().filter(e=>ids.has(e.t.machineId));
  const H=S.history.filter(h=>ids.has(h.machineId));
  const from=addDays(T0,-P),pfrom=addDays(T0,-2*P);
  const cur=H.filter(h=>parseD(h.done)>=from);
  const prev=H.filter(h=>{const d=parseD(h.done);return d>=pfrom&&d<from;});
  const ontime=a=>a.filter(h=>h.done<=h.due).length;
  const over=E.filter(e=>e.i.st==='overdue'),soon=E.filter(e=>e.i.st==='soon');
  const n=cur.length+over.filter(e=>e.i.left>=-P).length;
  const comp=n?{pct:Math.round(ontime(cur)/n*100),ontime:ontime(cur),n:n}:null;
  const rate=a=>a.length?ontime(a)/a.length*100:null;
  const dRate=(rate(cur)!=null&&rate(prev)!=null)?rate(cur)-rate(prev):null;
  const dCount=prev.length?(cur.length-prev.length)/prev.length*100:null;
  return {P:P,T0:T0,ms:ms,ids:ids,E:E,H:H,cur:cur,prev:prev,over:over,soon:soon,comp:comp,dRate:dRate,dCount:dCount,area:area};
}

function vGenel(){
  if(UI.area!=='all'&&!S.machines.some(m=>(m.area||'Diğer')===UI.area))UI.area='all';
  const demoNote=S.demo?'<div class="demo-note"><span><b>Örnek veri gösteriliyor.</b> Tarihler bugüne göre hazırlandı. Kendi makinelerini girmeden önce örnekleri temizleyebilirsin.</span>'+(sifreliB?'<button class="btn sm primary" data-act="sifre-ac">Rebul verisini aç</button>':'')+'<button class="btn sm" data-act="clear-demo">Örnek veriyi temizle</button></div>':'';
  if(!S.machines.length)return '<div class="card">'+empty('Henüz makine yok','Pano, makine ve bakım planı girdikçe dolar.<br><br><button class="btn primary" data-act="new-machine">'+ic('plus')+'İlk makineyi ekle</button>')+'</div>';
  const c=dashCtx(),T0=c.T0,E=c.E,tg=S.settings.target;
  if(!c.ms.length)return demoNote+'<div class="card">'+empty('Süzgece uyan makine yok','Bölüm veya sınıf süzgecini değiştir.')+'</div>';
  /* --- KPI hesapları --- */
  const compColor=!c.comp?'var(--ink-3)':c.comp.pct>=tg?'var(--good)':c.comp.pct>=tg-10?'var(--warn)':'var(--bad)';
  const maxOver=c.over.length?Math.max.apply(null,c.over.map(e=>-e.i.left)):0;
  const overA=c.over.filter(e=>klass(e.m)==='A').length;
  const in7=E.filter(e=>e.i.left>=0&&e.i.left<=7).length;
  let hrs30=0,cnt30=0;const wk=[0,0,0,0,0];
  E.forEach(e=>{occs(e.t,addDays(T0,35)).forEach(d=>{const k=diff(d<T0?T0:d,T0),h=+e.t.hours||0;if(k<=30){hrs30+=h;cnt30++;}if(k<35)wk[Math.floor(k/7)]+=h;});});
  const topK=c.ms.some(m=>klass(m)==='A')?'A':'B';
  const Am=c.ms.filter(m=>klass(m)===topK);
  const hA=Am.filter(m=>!E.some(e=>e.t.machineId===m.id&&e.i.st!=='ok'));
  const aPct=Am.length?Math.round(hA.length/Am.length*100):null;
  const kpis=kpi('PM uyum oranı',c.comp?'%'+c.comp.pct:'-',(c.comp?c.comp.ontime+' / '+c.comp.n+' zamanında':'son '+c.P+' gün: veri yok')+dl(c.dRate,' puan'),ring(c.comp?c.comp.pct:0,compColor,54,c.comp?c.comp.pct:'-','PM uyum oranı'))
    +kpi('Gecikmiş bakım',c.over.length,c.over.length?'A sınıfı: '+overA+' · en uzun '+maxOver+' gün':'gecikmiş iş yok',ic('alert'),c.over.length?'bad':'')
    +kpi('Yaklaşan bakım',c.soon.length,'7 gün içinde: '+in7+' iş',ic('clock'),c.soon.length?'warn':'')
    +kpi('30 günlük iş yükü',nfH(hrs30)+'<small>sa</small>',cnt30+' iş emri',spark(wk))
    +kpi('Tamamlanan ('+c.P+' gün)',c.cur.length,'zamanında: '+c.cur.filter(h=>h.done<=h.due).length+dl(c.dCount,'%'),ic('check'))
    +kpi(topK==='A'?'Kritik (A) makine sağlığı':'Önemli (B) makine sağlığı',aPct==null?'-':hA.length+' / '+Am.length,aPct==null?topK+' sınıfı makine yok':'gecikme ve uyarısı olmayan',ring(aPct||0,aPct==null?'var(--ink-3)':aPct>=80?'var(--good)':aPct>=50?'var(--warn)':'var(--bad)',54,aPct==null?'-':aPct,topK+' sınıfı sağlık'));
  /* --- Bölüme göre yük --- */
  const by={};
  E.forEach(e=>{const a=c.area(e.m);(by[a]=by[a]||{o:0,s:0,k:0})[e.i.st==='overdue'?'o':e.i.st==='soon'?'s':'k']++;});
  const arows=Object.keys(by).map(a=>({a:a,o:by[a].o,s:by[a].s,k:by[a].k,t:by[a].o+by[a].s+by[a].k})).sort((x,y)=>(y.o+y.s)-(x.o+x.s)||y.t-x.t);
  const amx=Math.max.apply(null,arows.map(r=>r.t).concat([1]));
  const pArea='<section class="panel"><div class="panel-h"><h3>Hatta göre bakım yükü</h3><span class="tg">Gecikmiş '+c.over.length+'</span></div>'
    +(arows.length?'<div class="hb">'+arows.slice(0,6).map(r=>'<div class="hb-row"><span class="nm" title="'+esc(r.a)+'">'+esc(r.a)+'</span><div class="hb-track"><div class="hb-fill" style="width:'+(r.t/amx*100).toFixed(1)+'%">'+(r.o?'<i class="o" style="flex:'+r.o+'"></i>':'')+(r.s?'<i class="s" style="flex:'+r.s+'"></i>':'')+(r.k?'<i class="k" style="flex:'+r.k+'"></i>':'')+'</div></div><b>'+r.t+'</b></div>').join('')+'</div>':empty('Plan yok','Bu süzgeçte bakım planı bulunmuyor.'))
    +'<div class="lg"><span><i style="background:var(--bad)"></i>Gecikmiş</span><span><i style="background:var(--warn)"></i>Yaklaşan</span><span><i style="background:var(--plan)"></i>Planlı</span></div></section>';
  /* --- Kategori payı --- */
  const cats={};
  E.forEach(e=>{const k=e.t.cat||'Diğer';cats[k]=(cats[k]||0)+1;});
  let items=Object.keys(cats).map(k=>({l:k,v:cats[k]})).sort((a,b)=>b.v-a.v);
  if(items.length>5){const rest=items.slice(5).reduce((a,x)=>a+x.v,0);items=items.slice(0,5).concat([{l:'Diğer',v:rest}]);}
  items.forEach((x,i)=>{x.c=PAL[i];});
  const totC=items.reduce((a,x)=>a+x.v,0)||1;
  const pCat='<section class="panel"><div class="panel-h"><h3>Bakım türü payı</h3><span class="tg mut">'+E.length+' plan</span></div><div class="donut">'+donut(items,148,E.length,'PLAN')
    +'<ul class="dn-leg">'+items.map(x=>'<li><i style="background:'+x.c+'"></i><span title="'+esc(x.l)+'">'+esc(x.l)+'</span><b>%'+Math.round(x.v/totC*100)+'</b></li>').join('')+'</ul></div>'
    +'<div class="mstats" style="margin-top:18px">'+['A','B','C'].map(k=>'<div><small>'+k+' sınıfı</small><b>'+c.ms.filter(m=>klass(m)===k).length+' <span class="faint" style="font:500 11px var(--font)">makine</span></b></div>').join('')+'</div></section>';
  /* --- Aylık planlanan yük --- */
  const mons=[];
  for(let i=0;i<6;i++){const d=new Date(T0.getFullYear(),T0.getMonth()+i,1);mons.push({l:MON_S[d.getMonth()],v:[0,0,0]});}
  const until=new Date(T0.getFullYear(),T0.getMonth()+6,0);
  E.forEach(e=>{const ci=['A','B','C'].indexOf(klass(e.m));occs(e.t,until).forEach(d=>{const dd=d<T0?T0:d,idx=(dd.getFullYear()-T0.getFullYear())*12+dd.getMonth()-T0.getMonth();if(idx>=0&&idx<6)mons[idx].v[ci]++;});});
  const pMon='<section class="panel"><div class="panel-h"><h3>Aylık planlanan bakım</h3><span class="tg mut">Sınıfa göre · 6 ay</span></div>'+colChart(mons,['var(--accent)','var(--blue)','var(--cyan)'])
    +'<div class="lg"><span><i style="background:var(--accent)"></i>A sınıfı</span><span><i style="background:var(--blue)"></i>B sınıfı</span><span><i style="background:var(--cyan)"></i>C sınıfı</span></div></section>';
  /* --- Makine tablosu --- */
  const trs=ranked().filter(m=>c.ids.has(m.id)).slice(0,8).map((m,i)=>{
    const l=E.filter(e=>e.t.machineId===m.id).sort((a,b)=>a.i.left-b.i.left);
    const ov=l.filter(e=>e.i.st==='overdue');
    const hc=c.cur.filter(h=>h.machineId===m.id),on=hc.filter(h=>h.done<=h.due).length;
    const n=hc.length+ov.filter(e=>e.i.left>=-c.P).length,pc=n?Math.round(on/n*100):null;
    const col=pc==null?'var(--ink-3)':pc>=tg?'var(--good)':pc>=tg-10?'var(--warn)':'var(--bad)';
    const nx=l[0];
    return '<tr data-act="edit-machine" data-id="'+m.id+'" tabindex="0"><td class="rk">'+(i+1)+'</td><td class="nm"><b>'+esc(m.name)+'</b><small>'+esc(m.tag)+'</small></td>'
      +'<td><div class="cl">'+clsB(klass(m))+critText(m)+'</div></td><td class="r">'+l.length+'</td>'
      +'<td class="r" style="color:'+(ov.length?'var(--bad)':'var(--ink-3)')+'">'+(ov.length||'-')+'</td>'
      +'<td class="dn '+(nx?nx.i.st:'')+'">'+(nx?dueText(nx.i.left)+'<small>'+fmtShort(nx.i.due)+'</small>':'-')+'</td>'
      +'<td>'+(pc==null?'<span class="faint">-</span>':'<div class="pc" style="--c:'+col+';--w:'+pc+'%"><span>%'+pc+'</span><i></i></div>')+'</td></tr>';
  }).join('');
  const pTbl='<section class="panel"><div class="panel-h"><h3>Makine önem sıralaması ve durum</h3><button class="btn sm ghost" data-act="go" data-r="makineler">Tümü</button></div><div class="tw"><table class="mt"><thead><tr><th>#</th><th>Makine</th><th>Sınıf · puan</th><th class="r">Plan</th><th class="r">Gecik.</th><th>Sonraki</th><th>Uyum ('+c.P+' g)</th></tr></thead><tbody>'+trs+'</tbody></table></div></section>';
  /* --- Aylık tamamlanan --- */
  const done6=[];
  for(let i=5;i>=0;i--){const d=new Date(T0.getFullYear(),T0.getMonth()-i,1);done6.push({l:MON_S[d.getMonth()],v:0});}
  c.H.forEach(h=>{const d=parseD(h.done),idx=(d.getFullYear()-T0.getFullYear())*12+d.getMonth()-T0.getMonth()+5;if(idx>=0&&idx<6)done6[idx].v++;});
  const lc=lineChart(done6);
  const last6=c.H.filter(h=>diff(T0,parseD(h.done))<=183);
  const ot6=last6.length?Math.round(last6.filter(h=>h.done<=h.due).length/last6.length*100):null;
  const pLine='<section class="panel"><div class="panel-h"><h3>Aylık tamamlanan bakım</h3><span class="tg mut">Ort. '+nfH(lc.avg)+' / ay</span></div>'+lc.svg
    +'<div class="mstats"><div><small>Bu ay</small><b>'+done6[5].v+'</b></div><div><small>Geçen ay</small><b>'+done6[4].v+'</b></div><div><small>6 ay uyum</small><b>'+(ot6==null?'-':'%'+ot6)+'</b></div></div></section>';
  /* --- Uyarılar ve içgörüler --- */
  const q=E.filter(e=>e.i.st!=='ok').sort(prio);
  const list=(q.length?q:E.slice().sort((a,b)=>a.i.left-b.i.left)).slice(0,5);
  const arow=e=>'<div class="al-row" data-act="open-task" data-id="'+e.t.id+'" tabindex="0"><span class="dot '+e.i.st+'"></span><div class="t"><b>'+esc(e.t.title)+'</b><small><span class="d '+e.i.st+'">'+dueText(e.i.left)+'</span> · '+esc(e.m.tag)+' · '+esc(e.m.name)+'</small></div><button class="btn sm done" data-act="done" data-id="'+e.t.id+'" aria-label="Yapıldı olarak işaretle">'+ic('check')+'</button></div>';
  const ins=[];
  const ovA=c.over.filter(e=>klass(e.m)==='A').sort(prio);
  if(ovA.length)ins.push(['bad','alert','<b>'+esc(ovA[0].m.tag)+' · '+esc(ovA[0].m.name)+'</b> A sınıfı makinede bakım '+(-ovA[0].i.left)+' gün gecikti: '+esc(ovA[0].t.title)+'.']);
  else if(!c.over.length)ins.push(['good','check','<b>Gecikmiş bakım yok.</b> Tüm planlar zamanında ilerliyor.']);
  if(c.comp){const gap=c.comp.pct-tg;ins.push(gap>=0?['good','target','<b>PM uyum oranı hedefin üzerinde:</b> %'+c.comp.pct+' (hedef %'+tg+').']:['warn','target','<b>PM uyum oranı hedefin '+(-gap)+' puan altında:</b> %'+c.comp.pct+' (hedef %'+tg+').']);}
  const lateBy={};
  c.cur.forEach(h=>{if(h.done>h.due){const o=lateBy[h.taskId]||(lateBy[h.taskId]={n:0,title:h.title,tag:h.tag});o.n++;}});
  const rep=Object.keys(lateBy).map(k=>lateBy[k]).sort((a,b)=>b.n-a.n)[0];
  if(rep&&rep.n>=2)ins.push(['warn','flame','<b>Tekrarlayan gecikme:</b> '+esc(rep.tag)+' · '+esc(rep.title)+' son '+c.P+' günde '+rep.n+' kez geç yapıldı. Planı veya kaynağı gözden geçir.']);
  else{let bi=0;wk.forEach((v,i)=>{if(v>wk[bi])bi=i;});if(wk[bi]>0)ins.push(['','cal','<b>En yoğun hafta:</b> '+fmtShort(addDays(T0,bi*7))+' - '+fmtShort(addDays(T0,bi*7+6))+' arası '+nfH(wk[bi])+' saat bakım var.']);}
  const pAl='<section class="panel"><div class="panel-h"><h3>'+(q.length?'Uyarılar ve öncelikler':'Sıradaki bakımlar')+'</h3><span class="tg '+(q.length?'':'mut')+'">'+(q.length?q.length+' açık':'uyarı yok')+'</span></div><div class="al">'+(list.length?list.map(arow).join(''):empty('Plan yok','Yeni plan ekleyerek başla.'))+'</div>'
    +'<div class="ins">'+ins.slice(0,3).map(x=>'<div class="'+x[0]+'">'+ic(x[1])+'<span>'+x[2]+'</span></div>').join('')+'</div></section>';
  /* --- Alt şerit --- */
  const wkTasks=E.filter(e=>e.i.left>=0&&e.i.left<=6),wkHrs=wkTasks.reduce((a,e)=>a+(+e.t.hours||0),0);
  const worstE=c.over.slice().sort((a,b)=>a.i.left-b.i.left)[0];
  const hot=arows.slice().sort((a,b)=>(b.o+b.s)-(a.o+a.s)||b.t-a.t)[0];

  const f3=fcard('building','En yoğun hat',hot?esc(hot.a):'-',hot?hot.o+' gecikmiş · '+hot.s+' yaklaşan · '+hot.t+' plan':'');
  const nOn=S.settings.notify&&notifState()==='granted';
  const f4=fcard('bell','Hatırlatma',nOn?'Bildirim açık':'Bildirim kapalı','<button data-act="export-ics">Takvim dosyası (.ics)</button> · <button data-act="go" data-r="ayarlar">Ayarlar</button>');
  return demoNote+'<div class="dash"><section class="kpis">'+kpis+'</section><section class="grid-3">'+pArea+pCat+pMon+'</section><section class="grid-3b">'+pTbl+pLine+pAl+'</section><section class="grid-4">'+f1+f2+f3+f4+'</section></div>';
}

/* =========================================================
   Görünüm: Zaman çizelgesi (takvim ve ajanda)
   ========================================================= */
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const CAL_DOW=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
function vZaman(){
  const T0=today(),roll=UI.calMode!=='month';
  const cf=S.settings.tlClass,lf=UI.tlLine||'all';
  const pass=m=>(cf==='all'||klass(m)===cf)&&(lf==='all'||(m.area||'Diğer')===lf);
  const E=enriched().filter(x=>pass(x.m));
  if(!S.machines.length)return '<div class="card">'+empty('Takvimde gösterilecek bakım yok','Önce makine ve bakım planı ekle.')+'</div>';
  let gs,weeks,title;
  if(roll){
    if(!UI.calR)UI.calR=mondayOf(T0);
    gs=UI.calR;weeks=5;title=fmtShort(gs)+' - '+fmtDate(addDays(gs,34));
  }else{
    if(!UI.calM)UI.calM=new Date(T0.getFullYear(),T0.getMonth(),1);
    const first=UI.calM;
    gs=mondayOf(first);
    weeks=Math.ceil((((first.getDay()+6)%7)+new Date(first.getFullYear(),first.getMonth()+1,0).getDate())/7);
    title=MONTHS[first.getMonth()]+' '+first.getFullYear();
  }
  const ge=addDays(gs,weeks*7-1),by={};
  E.forEach(x=>occs(x.t,ge).forEach((d,k)=>{
    if(d<gs)return;
    const key=iso(d);(by[key]=by[key]||[]).push({x:x,d:d,first:k===0,st:k===0?x.i.st:'ok'});
  }));
  Object.keys(by).forEach(k=>by[k].sort((a,b)=>cmpImp(a.x.m,b.x.m)));
  const selK=UI.selD||iso(T0),narrow=window.innerWidth<860,maxChips=narrow?2:3;
  let g='';
  CAL_DOW.forEach(n=>{g+='<div class="dh">'+n+'</div>';});
  for(let i=0;i<weeks*7;i++){
    const d=addDays(gs,i),k=iso(d),l=by[k]||[];
    const out=!roll&&d.getMonth()!==UI.calM.getMonth();
    const lab=(roll&&(i===0||d.getDate()===1))?d.getDate()+' '+MON_S[d.getMonth()]:d.getDate();
    const sev=l.some(o=>o.st==='overdue')?'o':l.some(o=>o.st==='soon')?'s':'k';
    g+='<button type="button" class="dc'+(out?' out':'')+(k===iso(T0)?' today':'')+(k===selK?' sel':'')+'" data-act="cal-day" data-d="'+k+'" aria-label="'+d.getDate()+' '+MONTHS[d.getMonth()]+', '+l.length+' bakım"><span class="n">'+lab+'</span>'
      +l.slice(0,maxChips).map(o=>'<span class="ch '+(o.st==='overdue'?'o':o.st==='soon'?'s':'k')+(o.first?' fi':'')+'">'+esc(o.x.m.tag)+'</span>').join('')
      +(l.length>maxChips?'<span class="more'+(sev==='o'?' o':'')+'">+'+(l.length-maxChips)+' daha</span>':'')+'</button>';
  }
  const over=E.filter(x=>x.i.st==='overdue').sort(prio);
  const sel=(by[selK]||[]);
  const hrs=sel.reduce((a,o)=>a+(+o.x.t.hours||0),0);
  const sd=parseD(selK);
  const item=(x,txt,st,canDone)=>'<div class="ai '+st+'" data-act="open-task" data-id="'+x.t.id+'" tabindex="0"><div class="ai-t"><b>'+esc(x.t.title)+'</b><small>'+esc(x.m.tag)+' · '+esc(x.m.name)+'</small></div><span class="ai-s">'+txt+'</span>'+(canDone?'<button type="button" class="btn sm done" data-act="done" data-id="'+x.t.id+'" aria-label="Yapıldı olarak işaretle">'+ic('check')+'</button>':'')+'</div>';
  const lineNames=Array.from(new Set(S.machines.map(m=>m.area||'Diğer'))).sort((a,b)=>a.localeCompare(b,'tr'));
  const controls='<div class="toolbar">'
    +seg('tl-class',[['all','Tümü'],['A','A'],['B','B'],['C','C']],cf)
    +'<label class="sel"><span>Hat</span><select id="tlLine" aria-label="Hat">'+[['all','Tümü']].concat(lineNames.map(a=>[a,a])).map(o=>'<option value="'+esc(o[0])+'"'+(lf===o[0]?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>'
    +seg('cal-mode',[['roll','5 hafta'],['month','Ay']],roll?'roll':'month')
    +'<span class="grow"></span><div class="nv"><button type="button" class="btn sm" data-act="cal-nav" data-v="-1" aria-label="Geri">‹</button><button type="button" class="btn sm" data-act="cal-nav" data-v="0">Bugün</button><button type="button" class="btn sm" data-act="cal-nav" data-v="1" aria-label="İleri">›</button></div></div>';
  const legend='<div class="tl-legend"><span><i class="l-o"></i>Gecikmiş</span><span><i class="l-s"></i>Yaklaşıyor</span><span><i class="l-k"></i>Planlı</span><span>Dolu etiket: planlanan ilk bakım, soluk etiket: sonraki tekrar</span></div>';
  return controls+legend+'<div class="cal"><div class="card cal-m"><div class="cal-h"><h3>'+title+'</h3><small>'+E.length+' plan</small></div><div class="cg">'+g+'</div></div>'
    +'<div class="ag"><section class="card ag-b"><h4><em>Gecikmiş</em> · '+over.length+' iş</h4>'
      +(over.length?over.slice(0,6).map(x=>item(x,(-x.i.left)+' gün','overdue',true)).join('')+(over.length>6?'<button type="button" class="btn sm ghost" data-act="go" data-r="planlar" style="margin-top:6px">Tümünü gör ('+over.length+')</button>':''):'<p class="faint ag-e">Gecikmiş iş yok.</p>')+'</section>'
    +'<section class="card ag-b"><h4>'+sd.getDate()+' '+MONTHS[sd.getMonth()]+' '+DOW[sd.getDay()]+(sel.length?' · '+sel.length+' iş'+(hrs?' · '+nfH(hrs)+' sa':''):'')+'</h4>'
      +(sel.length?sel.slice(0,40).map(o=>item(o.x,o.first?dueText(diff(o.d,T0)):'tekrar',o.st,o.first)).join('')+(sel.length>40?'<p class="faint ag-e">+'+(sel.length-40)+' iş daha</p>':''):'<p class="faint ag-e">Bu gün planlı bakım yok.</p>')+'</section></div></div>';
}

/* =========================================================
   Görünüm: Makineler
   ========================================================= */
function vMakineler(){
  const E=enriched(),R=ranked();
  const rows=R.map((m,i)=>{
    const l=E.filter(x=>x.t.machineId===m.id).sort((a,b)=>a.i.left-b.i.left);
    const nx=l[0];
    const crit=[{k:'prod',t:S.defs.crit.prod.t,opts:S.defs.crit.prod.opts}].concat(S.defs.crit.mq);

  }).join('');

function planFiltered(){
  let E=enriched();
  const q=trLower(UI.q.trim());
  if(q)E=E.filter(x=>trLower(x.t.title+' '+x.m.name+' '+x.m.tag+' '+(x.t.owner||'')+' '+(x.t.cat||'')).includes(q));
  if(UI.st!=='all')E=E.filter(x=>x.i.st===UI.st);
  if(UI.m!=='all')E=E.filter(x=>x.t.machineId===UI.m);
  if(UI.sort==='date')E.sort((a,b)=>a.i.left-b.i.left);
  else if(UI.sort==='machine')E.sort((a,b)=>a.m.name.localeCompare(b.m.name,'tr')||a.i.left-b.i.left);
  else E.sort(prio);
  return E;
}

/* =========================================================
   Görünüm: Geçmiş
   ========================================================= */
function vGecmis(){
  const H=S.history.slice().sort((a,b)=>a.done<b.done?1:a.done>b.done?-1:0);
  const d90=H.filter(h=>diff(today(),parseD(h.done))<=90);
  const late=d90.filter(h=>h.done>h.due);
  const avg=late.length?Math.round(late.reduce((a,h)=>a+diff(parseD(h.done),parseD(h.due)),0)/late.length):0;
  const pct=d90.length?Math.round((d90.length-late.length)/d90.length*100):null;
  const rows=H.slice(0,300).map(h=>{
    const l=diff(parseD(h.done),parseD(h.due));
    return '<div class="hrow"><div><b>'+fmtShort(parseD(h.done))+'</b><small>'+parseD(h.done).getFullYear()+'</small></div>'
      +'<div><b>'+esc(h.mname||'-')+'</b><small class="mono">'+esc(h.tag||'')+'</small></div>'
      +'<div><b>'+esc(h.title)+'</b><small>Planlanan: '+fmtDate(parseD(h.due))+'</small></div>'
      +'<div>'+(l<=0?'<span class="pill good">Zamanında</span>':'<span class="pill soon">'+l+' gün geç</span>')+'</div>'
      +'<div><b>'+esc(h.by||'-')+'</b><small>'+esc((h.chk?h.chk.ok+'/'+h.chk.n+' madde uygun. ':'')+(h.note||''))+'</small></div></div>';
  }).join('');
  return '<div class="hsum"><div class="card stat"><small>Son 90 günde tamamlanan</small><b>'+d90.length+'</b></div>'
    +'<div class="card stat '+(pct==null?'':pct>=90?'good':pct>=75?'warn':'bad')+'"><small>Zamanında tamamlama</small><b>'+(pct==null?'-':'%'+pct)+'</b></div>'
    +'<div class="card stat"><small>Geç kalanlarda ortalama gecikme</small><b>'+avg+' gün</b></div></div>'
    +'<div class="card">'+(rows||empty('Henüz tamamlanmış bakım yok','Bir planda "Yapıldı" düğmesine bastığında kayıt buraya düşer.'))+'</div>';
}

/* ---- Tanım düzenleme olayları ---- */
const sortLines=()=>S.defs.lines.sort((a,b)=>b.imp-a.imp||a.name.localeCompare(b.name,'tr'));
function defChange(t){
  const k=t.dataset.def,i=+t.dataset.i,f=t.dataset.f,v=String(t.value).trim(),D=S.defs;
  const rename=(list,getName,setName,cascade,label)=>{
    const cur=getName(list[i]);
    if(!v){t.value=cur;toast('Ad boş olamaz.');return;}
    if(v===cur)return;
    if(list.some((x,j)=>j!==i&&getName(x)===v)){t.value=cur;toast('Bu ad zaten var.');return;}
    cascade(cur,v);setName(list,i,v);save();render();toast(label+' güncellendi');
  };
  if(k==='line'){
    const l=D.lines[i];if(!l)return;
    if(f==='imp'){l.imp=+t.value;sortLines();save();render();toast('Hat önemi kaydedildi');return;}
    rename(D.lines,x=>x.name,(L,j,nv)=>{L[j].name=nv;sortLines();},(a,b)=>{S.machines.forEach(m=>{if(m.area===a)m.area=b;});if(UI.area===a)UI.area=b;},'Hat');
  }else if(k==='cat'){
    rename(D.cats,x=>x,(L,j,nv)=>{L[j]=nv;},(a,b)=>{S.tasks.forEach(tk=>{if(tk.cat===a)tk.cat=b;});},'Bakım türü');
  }else if(k==='owner'){
    rename(D.owners,x=>x,(L,j,nv)=>{L[j]=nv;},(a,b)=>{S.tasks.forEach(tk=>{if(tk.owner===a)tk.owner=b;});},'Sorumlu');
  }else if(k==='machine-line'){
    const m=mById(t.dataset.id);if(m){m.area=t.value;save();render();toast('Makine hatta bağlandı');}
  }else if(k==='clsname'){
    const c=t.dataset.k;if(v)D.clsName[c]=v;else t.value=D.clsName[c];save();toast('Sınıf adı kaydedildi');
  }else if(k==='critcut'){
    const key=t.dataset.k,val=Math.max(1,Math.round(+t.value)||0),cu=D.crit.cut;
    const n=Object.assign({},cu);n[key]=val;
    if(!(n.prodA>n.prodB&&n.mqA>n.mqB)){t.value=cu[key];toast('Eşikler tutarsız: A için gereken puan, B için gerekenden büyük olmalı.');return;}
    cu[key]=val;save();render();toast('Eşik kaydedildi, sınıflar güncellendi');
  }else if(k==='critt'){
    const g=t.dataset.g,cr=g==='prod'?D.crit.prod:D.crit.mq.find(x=>x.k===g);
    if(cr){if(v)cr.t=v;else t.value=cr.t;save();toast('Kriter adı kaydedildi');}
  }else if(k==='crito'){
    const g=t.dataset.g,j=+t.dataset.j,cr=g==='prod'?D.crit.prod:D.crit.mq.find(x=>x.k===g),o=cr&&cr.opts[j];
    if(!o)return;
    if(f==='l'){if(v)o[0]=v;else t.value=o[0];save();toast('Seçenek kaydedildi');}
    else{
      const n=Math.max(0,Math.round(+t.value)||0),old=o[1];
      let moved=0;
      if(old!==n)S.machines.forEach(m=>{if(m.c&&+m.c[g]===old){m.c[g]=n;moved++;}});
      o[1]=n;t.value=n;save();render();
      toast('Puan kaydedildi'+(moved?'. '+moved+' makinenin puanı da güncellendi.':'.'));
    }
  }
}
function defAdd(el){
  const k=el.dataset.k,inp=$('#new_'+k),v=inp?inp.value.trim():'',D=S.defs;
  if(!v){toast('Önce bir ad yaz.');if(inp)inp.focus();return;}
  if(k==='line'){if(D.lines.some(l=>l.name===v)){toast('Bu hat zaten var.');return;}D.lines.push({name:v,imp:3});sortLines();}
  else if(k==='cat'){if(D.cats.indexOf(v)>=0){toast('Bu tür zaten var.');return;}D.cats.push(v);}
  else{if(D.owners.indexOf(v)>=0){toast('Bu kişi zaten var.');return;}D.owners.push(v);}
  save();render();toast('Eklendi');
  setTimeout(()=>{const n=$('#new_'+k);if(n)n.focus();},0);
}
async function defDel(el){
  const k=el.dataset.k,i=+el.dataset.i,D=S.defs;
  if(k==='line'){
    const l=D.lines[i];if(!l)return;
    const n=S.machines.filter(m=>m.area===l.name).length;
    if(n&&!(await ask('Hat silinsin mi?',n+' makine "'+l.name+'" hattına bağlı. Hat silinirse bu makineler hat atanmamış olur.','Sil')))return;
    S.machines.forEach(m=>{if(m.area===l.name)m.area='';});
    if(UI.area===l.name)UI.area='all';
    D.lines.splice(i,1);
  }else if(k==='cat'){
    const c=D.cats[i];if(c===undefined)return;
    const n=S.tasks.filter(t=>t.cat===c).length;
    if(n&&!(await ask('Bakım türü silinsin mi?',n+' plan "'+c+'" türünde. Tür silinirse bu planların türü boş kalır.','Sil')))return;
    S.tasks.forEach(t=>{if(t.cat===c)t.cat='';});
    D.cats.splice(i,1);
  }else{
    const o=D.owners[i];if(o===undefined)return;
    const n=S.tasks.filter(t=>t.owner===o).length;
    if(n&&!(await ask('Kişi listeden silinsin mi?',n+' planda "'+o+'" yazıyor. Listeden silinir, planlardaki ad olduğu gibi kalır.','Sil')))return;
    D.owners.splice(i,1);
  }
  save();render();toast('Silindi');
}

const dlg=$('#dlg');
function openDlg(html,onSubmit,setup){
  dlg.innerHTML=html;
  if(!dlg.open){try{dlg.showModal();}catch(e){dlg.setAttribute('open','');}}
  const f=$('form',dlg);
  if(f&&onSubmit)f.addEventListener('submit',e=>{e.preventDefault();if(onSubmit(new FormData(f),f)!==false)closeDlg();});
  if(setup)setup(f);
  const first=$('input:not([type=hidden]),select,textarea',dlg);
  if(first&&matchMedia('(pointer:fine)').matches)first.focus();
}
function closeDlg(){
  if(dlg.open){try{dlg.close();}catch(e){dlg.removeAttribute('open');}}
  dlg.innerHTML='';
}
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg();});
dlg.addEventListener('cancel',()=>{setTimeout(()=>{dlg.innerHTML='';},0);});
let toastT=0;
function toast(msg){
  const t=$('#toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3400);
}
function ask(title,msg,ok){
  return new Promise(res=>{
    openDlg('<div class="dlg"><div class="dlg-h"><div><h2>'+esc(title)+'</h2></div></div><div class="dlg-b"><p class="muted">'+esc(msg)+'</p></div><div class="dlg-f"><button class="btn" type="button" id="askNo">Vazgeç</button><button class="btn danger" type="button" id="askYes">'+esc(ok||'Sil')+'</button></div></div>');
    $('#askYes').onclick=()=>{closeDlg();res(true);};
    $('#askNo').onclick=()=>{closeDlg();res(false);};
  });
}

/* Bakım formu (kontrol listesi): satır başına "Ünite | Kontrol noktası | Yöntem | Ekipman". */
const itemsText=a=>(a||[]).map(i=>[i.u||'',i.p||'',i.m||'',i.e||''].join(' | ')).join('\n');
function parseItems(txt){
  return String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).slice(0,150).map(l=>{
    const p=l.split('|').map(x=>x.trim());

function sanitize(o){

  const ids=new Set(machines.map(m=>m.id));
  const tasks=o.tasks.filter(t=>t&&t.id&&t.title&&ids.has(t.machineId)&&re.test(String(t.due))).map(t=>({id:String(t.id),machineId:t.machineId,title:String(t.title),cat:String(t.cat||''),every:Math.max(1,parseInt(t.every,10)||1),unit:UNIT[t.unit]?t.unit:'ay',mode:t.mode==='after'?'after':'fixed',due:String(t.due),day:Math.min(31,Math.max(0,parseInt(t.day,10)||0)),lead:(t.lead===null||t.lead===undefined||t.lead==='')?null:Math.max(0,+t.lead||0),owner:String(t.owner||''),hours:+t.hours||0,notes:String(t.notes||''),items:Array.isArray(t.items)?t.items.slice(0,150).map(i=>({u:String(i.u||''),p:String(i.p||''),m:String(i.m||''),e:String(i.e||'')})).filter(i=>i.p):[]}));
  const history=(Array.isArray(o.history)?o.history:[]).filter(h=>h&&re.test(String(h.done))&&re.test(String(h.due))&&h.title).map(h=>({id:String(h.id||uid()),taskId:String(h.taskId||''),machineId:String(h.machineId||''),tag:String(h.tag||''),mname:String(h.mname||''),title:String(h.title),due:String(h.due),done:String(h.done),by:String(h.by||''),note:String(h.note||''),chk:(h.chk&&typeof h.chk==='object'&&Array.isArray(h.chk.bad))?{n:+h.chk.n||0,ok:+h.chk.ok||0,bad:h.chk.bad.slice(0,150).map(b=>({u:String(b.u||''),p:String(b.p||''),r:String(b.r||'')}))}:null}));
  return {machines,tasks,history,lead:o.settings&&o.settings.lead,defs:o.defs};

const b64u=bytes=>{let s='';bytes.forEach(b=>{s+=String.fromCharCode(b);});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;};
async function encodeShare(obj){
  let bytes=new TextEncoder().encode(JSON.stringify(obj)),tag='r';
  if('CompressionStream' in window){
    const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
    bytes=new Uint8Array(await new Response(cs).arrayBuffer());tag='g';
  }
  return tag+b64u(bytes);
}
async function decodeShare(str){
  let bytes=unb64u(str.slice(1));
  if(str[0]==='g'){
    const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    bytes=new Uint8Array(await new Response(ds).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
